name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pre-existing lint debt (prettier drift + no-explicit-any across the
      # codebase) is Phase 11 scope; keep it visible without blocking merges.
      - name: Lint (non-blocking until Phase 11)
        run: npm run lint
        continue-on-error: true

      - name: Static authorization, validator and tenancy checks
        run: |
          npm run check:policy
          npm run check:validators
          npm run check:tenancy

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
