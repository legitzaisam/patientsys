<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetheria Patient Portal — Navigable Wireframes v0.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Tokens lifted verbatim from src/styles.css — "Bright Pastels,
   Notebook Lines". Same values, same names, so anything built
   from these wireframes maps onto the clinic app 1:1.
   ============================================================ */
:root{
  --radius:0.875rem;
  --background:#f6f7f8;
  --wash-1:rgba(246,228,166,.5);
  --wash-2:rgba(244,206,190,.34);
  --rule:rgba(41,48,57,.025);

  --foreground:#2f3f66;
  --ink-2:#46557a;
  --ink-3:#6a7390;
  --subtle:#7d8498;

  --glass:rgba(255,255,255,.82);
  --glass-2:rgba(255,255,255,.62);
  --glass-line:rgba(255,255,255,.55);
  --glass-hi:rgba(255,255,255,.9);
  --edge:rgba(255,255,255,.7);
  --edge-2:rgba(47,63,102,.07);
  --edge-hi:rgba(255,255,255,.92);
  --sheen:rgba(255,255,255,.5);
  --bloom:rgba(200,175,105,.3);
  --bar:rgba(192,200,210,.42);
  --blur-glass:26px;
  --sidebar:rgba(255,255,255,.78);

  --accent:#eed488; --accent-hi:#faedc2; --accent-deep:#e2c46b;
  --accent-ink:#7a6220; --accent-foreground:#332d18;
  --accent-soft:rgba(238,212,136,.3); --accent-wash:rgba(238,212,136,.14);
  --accent-line:rgba(214,183,92,.42);

  --destructive:#dc6c96; --destructive-bg:rgba(250,204,226,.48); --destructive-ink:#a3456e;
  --destructive-foreground:#fff7fb;
  --success:#4a9d75;     --success-bg:rgba(179,232,196,.55);     --success-ink:#2d6a4c;
  --consent:#b9a6e8;     --consent-bg:rgba(224,213,248,.55);     --consent-ink:#5c4a94;
  --sky:#8fc7ea;         --sky-bg:rgba(190,224,244,.5);          --sky-ink:#3d6f96;
  --lane-4:#8fc7ea;      --lane-7:#b9a6e8;
  --aftercare:#ef9bc4;   --aftercare-ink:#8a3d66;

  --shadow-glass:0 1px 2px rgba(47,63,102,.06),0 8px 24px -10px rgba(47,63,102,.18),inset 0 1px 0 var(--edge-hi);
  --shadow-popover:0 2px 8px -2px rgba(47,63,102,.12),0 12px 32px -12px rgba(47,63,102,.28);
  --shadow-bloom:0 8px 20px -10px var(--bloom),inset 0 1px 0 rgba(255,255,255,.55);
  --shadow-lift:0 14px 36px -14px rgba(47,63,102,.3);
  --shadow-inset-hi:inset 0 1px 0 var(--edge-hi);

  --sans:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --meta:#a3456e; --meta-bg:rgba(250,204,226,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--foreground);
  background:#eceef1;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

/* ---------------- tool chrome (not product) ---------------- */
.wrap{display:grid;grid-template-rows:auto 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:16px;padding:11px 20px;background:#fff;border-bottom:1px solid rgba(47,63,102,.1)}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.012em}
.brand span{font-size:11px;color:var(--subtle);font-family:var(--mono);margin-left:9px}
.spacer{flex:1}
.seg{display:flex;border:1px solid rgba(47,63,102,.14);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--foreground);color:#fff}
.tbtn{padding:6px 12px;font-size:12.5px;border:1px solid rgba(47,63,102,.14);border-radius:9px;color:var(--ink-3)}
.tbtn[aria-pressed="true"]{border-color:var(--meta);background:var(--meta-bg);color:var(--meta)}
.stepper{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.stepper button{border:1px solid rgba(47,63,102,.14);border-radius:8px;width:28px;height:28px}
.stepper button:disabled{opacity:.3;cursor:default}
.main{display:grid;grid-template-columns:1fr 320px;min-height:0;position:relative}
body.noannot .main,body.chrome-min .main{grid-template-columns:1fr}
body.norail .rail,body.chrome-min .rail{display:none}
body.noannot .notes,body.chrome-min .notes{display:none}
body.chrome-min .wrap{grid-template-rows:1fr}
body.chrome-min .topbar{display:none}
@media (max-width:1120px){.main{grid-template-columns:1fr}.notes{display:none}}

.rail{
  position:absolute;z-index:20;inset:0 auto 0 0;width:238px;
  background:#fff;border-right:1px solid rgba(47,63,102,.1);
  overflow-y:auto;padding:14px 10px 40px;box-shadow:var(--shadow-popover);
}
.chrome-dock{
  display:none;position:fixed;z-index:40;left:50%;bottom:16px;
  transform:translateX(-50%);align-items:center;gap:8px;
  padding:7px 8px 7px 12px;border-radius:14px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(47,63,102,.12);box-shadow:var(--shadow-popover);
}
body.chrome-min .chrome-dock{display:flex}
.chrome-dock .dock-label{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.chrome-dock .stepper{gap:6px}
.chrome-dock select{height:28px;max-width:200px;border:1px solid rgba(47,63,102,.14);border-radius:8px;padding:0 8px;font:inherit;font-size:12px;color:var(--ink-2);background:#fff}
.railgroup{margin-bottom:17px}
.railgroup h4{margin:0 0 6px;padding:0 8px;font-size:10.5px;font-weight:600;color:var(--subtle);font-family:var(--mono)}
.railitem{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:12.8px;color:var(--ink-2);line-height:1.35}
.railitem:hover{background:rgba(47,63,102,.05)}
.railitem[aria-current="true"]{background:var(--foreground);color:#fff}
.railitem em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;opacity:.6}

.stage{overflow:hidden;padding:0;display:block;min-width:0;min-height:0}
.frame{
  position:relative;overflow:hidden;width:100%;height:100%;
  background-color:var(--background);
  background-image:
    radial-gradient(900px 560px at 8% -10%,var(--wash-1),transparent 68%),
    radial-gradient(820px 520px at 96% 2%,var(--wash-2),transparent 66%),
    repeating-linear-gradient(0deg,var(--rule) 0px,var(--rule) 1px,transparent 1px,transparent 14px);
}
.stage.mobile{overflow:auto;padding:26px;display:flex;justify-content:center;align-items:flex-start}
.stage.mobile .frame{width:390px;height:812px;border-radius:32px;border:1px solid rgba(47,63,102,.18);box-shadow:var(--shadow-lift)}
.screen{height:100%;display:flex;overflow:hidden;position:relative}
.screen.bare{flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:0 20px 28px}
.stage.desktop .scroll{padding:0 26px 26px}

/* ---------------- product chrome: AppShell clone ---------------- */
.shell{display:flex;height:100%;min-height:0;width:100%}
.aside{
  position:relative;flex:none;display:flex;flex-direction:column;
  border-right:1px solid var(--edge);
  background:var(--sidebar);
  backdrop-filter:blur(var(--blur-glass));
  -webkit-backdrop-filter:blur(var(--blur-glass));
  box-shadow:inset -1px 0 0 var(--edge-hi);
}
.shell.nav-closed .aside{display:none}
/* ---------------------------------------------------------------
   rem vs px: the clinic shell is built from Tailwind spacing/type
   utilities, which are rem (--spacing: 0.25rem, text-base: 1rem).
   Those are written as rem here so the shell tracks the browser's
   root font size exactly as the clinic does. Only values the clinic
   writes as arbitrary px — text-[13px], rounded-[11px], h-[30px] —
   stay px. Hardcoding the 16px-equivalents makes the wireframe
   diverge for anyone whose browser font size is not the default.
   --------------------------------------------------------------- */
.aside-inner{display:flex;flex-direction:column;gap:1.25rem;height:100%;min-height:0;padding:1.25rem 1rem}
.aside-top{display:flex;align-items:center;gap:.25rem}
.brand-lockup{display:flex;align-items:center;gap:.625rem;min-width:0;flex:1;padding:0 .375rem}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;line-height:1;color:var(--accent-foreground);
  background:linear-gradient(140deg,var(--accent-hi),var(--accent) 70%);box-shadow:var(--shadow-bloom);
}
/* The mark never compresses; the wordmark gives way and ellipsises.
   Mirrors shrink-0 on BrandMark and min-w-0 truncate on BrandLockup. */
.brand-name{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:1rem;font-weight:600;letter-spacing:-.016em;
}
/* Mirrors <Button size="icon"> in ui/button.tsx: pill radius, 14px glyphs
   ([&_svg]:size-3.5 wins over the icon's own h-4 w-4 on specificity),
   0.08 hover / 0.14 active, 200ms transition. */
.icon-btn{
  width:2rem;height:2rem;border-radius:999px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);
  transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,filter .2s,transform .2s;
}
.icon-btn:hover{color:var(--foreground);background:rgba(47,63,102,.08)}
.icon-btn:active{background:rgba(47,63,102,.14);transform:scale(.98)}
.icon-btn svg{width:.875rem;height:.875rem;flex:none}
.icon-btn.outline{
  width:2.5rem;height:2.5rem;border:1px solid var(--edge);
  background:var(--glass-2);box-shadow:var(--shadow-inset-hi);color:var(--foreground);
}
.icon-btn.outline:hover{border-color:var(--edge-2);background:rgba(47,63,102,.08);box-shadow:var(--shadow-lift)}
.aside-resizer{
  position:absolute;inset:0 0 0 auto;width:.25rem;cursor:col-resize;z-index:12;
}
.aside-resizer:hover,.aside-resizer:active{background:var(--accent-soft)}
.aside-nav{
  flex:1;min-height:0;margin-top:.25rem;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:1.5rem;padding-bottom:1.25rem;
  scrollbar-width:none;-ms-overflow-style:none;
}
.aside-nav::-webkit-scrollbar{display:none;width:0;height:0}
.nav-group{display:flex;flex-direction:column;gap:.25rem}
.nav-group h5{margin:0 .375rem .5rem;padding:.25rem 0 0;font-size:.875rem;font-weight:600;letter-spacing:.02em;color:var(--ink-3)}
.nav-item{
  display:flex;align-items:center;gap:.625rem;width:100%;text-align:left;
  padding:.625rem;border-radius:11px;font-size:13px;font-weight:500;color:var(--ink-2);
  transition:background-color .15s,color .15s;
}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:rgba(47,63,102,.08);color:var(--foreground)}
.nav-item:active{background:rgba(47,63,102,.12)}
.nav-item[aria-current="true"]{
  background:linear-gradient(96deg,var(--accent-soft),transparent 96%);
  color:var(--foreground);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 var(--edge-hi);
}
.nav-ico{
  width:1.25rem;height:1.25rem;flex:none;display:grid;place-items:center;border-radius:6px;
  border:1px solid var(--edge);background:var(--glass-2);color:var(--ink-2);
}
.nav-ico svg{width:.75rem;height:.75rem}
.nav-item[aria-current="true"] .nav-ico{
  border-color:transparent;color:var(--accent-foreground);
  background:linear-gradient(140deg,var(--accent-hi),var(--accent));box-shadow:var(--shadow-bloom);
}
.nav-item .n{margin-left:auto;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.nav-item[aria-current="true"] .n{color:var(--ink-2)}

.maincol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.canvas{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.toolbar{
  position:sticky;top:0;z-index:12;flex:none;height:3.5rem;display:flex;align-items:center;gap:.75rem;
  margin:0 -1.25rem;padding:0 1.25rem;pointer-events:none;
}
.stage.desktop .toolbar{margin:0 -26px;padding:0 26px}
.toolbar-end{margin-left:auto;display:flex;align-items:center;gap:.5rem;height:2.5rem;pointer-events:auto}
.tchip{
  width:2.25rem;height:2.25rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;position:relative;
  color:var(--ink-2);
}
.tchip:hover{background:rgba(47,63,102,.08);color:var(--foreground)}
.tchip:active{background:rgba(47,63,102,.14)}
.tchip svg{width:.875rem;height:.875rem}
/* NotificationBell count (notification-bell.tsx): overhangs the chip at
   -0.5, 1rem tall pill, text-2xs / font-medium on --destructive-foreground. */
.tchip .dotn{
  position:absolute;top:-.125rem;right:-.125rem;
  display:inline-flex;align-items:center;justify-content:center;
  height:1rem;min-width:1rem;padding:0 .25rem;border-radius:999px;
  background:var(--destructive);color:var(--destructive-foreground);
  font-size:.6875rem;line-height:1rem;font-weight:500;
}
.acct{
  display:flex;align-items:center;gap:.5rem;height:2.5rem;max-width:220px;
  padding:0 .625rem 0 .25rem;border-radius:999px;text-align:left;
}
.acct:hover{background:rgba(47,63,102,.08)}
.acct .av{
  width:1.75rem;height:1.75rem;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-foreground);font-size:11px;font-weight:600;box-shadow:var(--shadow-bloom);
}
.acct .nm{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.acct .rl{display:block;font-size:11px;color:var(--ink-2)}
/* Account pill is a plain <button>, not <Button> — its chevron keeps h-4 w-4. */
.acct .chev{width:1rem;height:1rem;color:var(--ink-3);flex:none}

.canvas{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:0 20px 20px}
.stage.desktop .canvas{padding:0 26px 26px}
.stage.mobile .canvas{padding:0 16px 16px}
.canvas-inner{width:100%;max-width:1400px;margin:8px auto 0;flex:1}

.page-header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;flex:none}
.page-header .lead{min-width:0}
.page-title{margin:0;font-size:22px;font-weight:600;letter-spacing:-.016em;line-height:1.2}
.page-subtitle{margin:4px 0 0;font-size:14px;line-height:1.25;color:var(--ink-2)}
.page-header .back{
  width:36px;height:36px;border-radius:999px;display:grid;place-items:center;margin-bottom:4px;
  color:var(--ink-3);font-size:20px;line-height:1;
}
.page-header .back:hover{background:rgba(47,63,102,.08);color:var(--foreground)}

.aside-scrim{position:absolute;inset:0;background:rgba(47,63,102,.22);backdrop-filter:blur(2px);z-index:20}
.stage.mobile .aside{
  position:absolute;inset:0 auto 0 0;z-index:21;height:100%;
  box-shadow:var(--shadow-popover);
}
.stage.mobile .shell.nav-closed .aside,
.stage.mobile .shell.nav-closed .aside-scrim{display:none}

.seg-pill{
  display:inline-flex;align-items:center;gap:2px;height:34px;padding:2px;
  border-radius:999px;border:1px solid var(--edge);background:var(--glass-2);box-shadow:var(--shadow-inset-hi);
}
.seg-pill button{
  height:28px;padding:0 14px;border-radius:999px;font-size:12px;letter-spacing:.02em;color:var(--ink-2);
}
.seg-pill button:hover{background:rgba(47,63,102,.08);color:var(--foreground)}
.seg-pill button[aria-pressed="true"]{
  background:var(--accent-soft);font-weight:600;color:var(--foreground);
  box-shadow:inset 0 0 0 1px var(--edge);
}

/* unauthenticated: staff /auth split */
.auth{display:grid;height:100%;min-height:0}
.stage.desktop .auth{grid-template-columns:1fr 1fr}
/* Mirrors routes/portal.tsx — the PATIENT sign-in panel: pastel lane gradient,
   navy ink, standard gold lockup. Not routes/auth.tsx, which is the gold staff
   panel with the on-gold (glass) brand mark. */
.auth-aside{
  display:none;flex-direction:column;justify-content:space-between;padding:48px;
  /* --lane-4 at 45%, --glass-2, --lane-7 at 40% — literal rgba because
     color-mix() rounds a channel off the values Tailwind produces. */
  background:linear-gradient(to bottom right,rgba(143,199,234,.45),var(--glass-2) 50%,rgba(185,166,232,.4) 70%);
  border-right:1px solid var(--edge);box-shadow:var(--shadow-inset-hi);
  color:var(--foreground);position:relative;overflow:hidden;
}
.stage.desktop .auth-aside{display:flex}
.auth-brand{display:flex;align-items:center;gap:8px;flex:none}
.auth-brand .lockup{display:flex;align-items:center;gap:10px;min-width:0}
.auth-pill{
  flex:none;border:1px solid var(--edge);border-radius:999px;padding:2px 8px;
  font-size:11px;line-height:1rem;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap;
}
.auth-aside h1{margin:0;font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1;max-width:28rem}
.auth-aside p{margin:16px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:28rem}
.auth-aside .foot{margin:0;font-size:12px;color:var(--ink-2)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto}
.auth-card{width:100%;max-width:24rem;padding:24px 28px;margin:0}

/* ---------------- glass primitives ---------------- */
.card{
  position:relative;border-radius:22px;border:1px solid var(--edge);background:var(--glass);
  backdrop-filter:blur(26px) saturate(1.5);box-shadow:var(--shadow-glass);
  padding:15px;margin-bottom:11px;
}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,var(--sheen),transparent 46%);pointer-events:none}
.card>*{position:relative;z-index:1}
.card.tint-consent{background:var(--consent-bg);border-color:rgba(185,166,232,.42)}
.card.tint-success{background:var(--success-bg);border-color:rgba(74,157,117,.28)}
.card.tint-sky{background:var(--sky-bg);border-color:rgba(143,199,234,.42)}
.card.tint-stop{background:var(--destructive-bg);border-color:rgba(220,108,150,.32)}
.card.tint-accent{background:linear-gradient(135deg,var(--accent-soft),var(--accent-wash));border-color:var(--accent-line)}
.card.dashed{background:var(--glass-2);border-style:dashed;border-color:var(--edge-2);box-shadow:none}
button.card{display:block;width:100%;text-align:left}
button.card:hover{box-shadow:var(--shadow-lift)}

h3.ct{margin:0 0 3px;font-size:15px;font-weight:600;letter-spacing:-.012em}
.sect{margin:22px 0 12px;font-size:17px;font-weight:600;letter-spacing:-.016em;line-height:1.25;color:var(--foreground)}
.sect:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:2px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.tiny{font-size:11px;color:var(--ink-3)}
.strong{font-weight:600}
.hr{height:1px;background:var(--edge-2);margin:12px 0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500;border:1px solid var(--edge);background:var(--glass-2);color:var(--ink-2)}
.chip.ok{background:var(--success-bg);border-color:rgba(74,157,117,.3);color:var(--success-ink)}
.chip.due{background:var(--consent-bg);border-color:rgba(185,166,232,.45);color:var(--consent-ink)}
.chip.stop{background:var(--destructive-bg);border-color:rgba(220,108,150,.35);color:var(--destructive-ink)}
.chip.sky{background:var(--sky-bg);border-color:rgba(143,199,234,.45);color:var(--sky-ink)}
.chip.gold{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1;
  background:linear-gradient(140deg,var(--accent-hi),var(--accent) 75%);
  color:var(--accent-foreground);border:1px solid var(--edge);box-shadow:var(--shadow-bloom);
  transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,filter .2s,transform .2s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn.sec{background:var(--glass-2);color:var(--foreground);border-color:var(--edge);box-shadow:var(--shadow-inset-hi)}
.btn.sec:hover{border-color:var(--edge-2);background:rgba(47,63,102,.08);box-shadow:var(--shadow-lift);filter:none}
.btn.sec:active{background:rgba(47,63,102,.14)}

  gear:svg('<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.7 1 1.1 1.8 1.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>'),
  bell:svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
  chevron:svg('<path d="m6 9 6 6 6-6"/>'),
  panel:svg('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>'),
  panelClose:svg('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>')
};

const TABS=[
  {id:'dash',    label:'Dashboard',    go:'dash-b'},
  {id:'appts',   label:'Appointments', go:'appointments'},
  {id:'profile', label:'Profile',      go:'profile'},
  {id:'settings',label:'Settings',     go:'settings'}
];
const DNAV=[
  {h:'Care', items:[
    {label:'Dashboard', go:'dash-b', ico:'dash'},
    {label:'Appointments', go:'appointments', ico:'cal'}
  ]},
  {h:'You', items:[
    {label:'Profile', go:'profile', ico:'user'},
    {label:'Forms', go:'forms', ico:'file', n:2},
    {label:'Treatments', go:'treatments', ico:'spark'},
    {label:'Photos', go:'photos', ico:'photo'},
    {label:'Health information', go:'health', ico:'heart'}
  ]},
  {h:'Account', items:[
    {label:'Settings', go:'settings', ico:'gear'},
    {label:'Payments', go:'payments', ico:'pay'},
    {label:'Sign-in and security', go:'security', ico:'lock'},
    {label:'Your data', go:'data', ico:'data'}
  ]}
];
const PAGE_SUB={
  appointments:'Upcoming visits, requests and past treatments.',
  'appt-detail':'What is booked, what is still outstanding, and how to change it.',
  cancel:'Confirm the fee consequence before the visit is released.',
  reschedule:'Inside the notice window, changes go through the clinic.',
  'book-1':'Choose a treatment. New visits start as a request.',
  'book-2':'Pick a time. Slots inside cooling-off stay visible and disabled.',
  'book-3':'Screening can convert the request rather than refuse it.',
  'book-4':'Requested is not booked. Wait for the clinic to confirm.',
  profile:'Your record at Ridgeway Skin Clinic.',
  forms:'Consent, intake and aftercare in one place.',
  intake:'First-time health questionnaire. You can stop and come back.',
  consent:'Read the discussion summary, then sign.',
  signed:'Cooling-off has started. Withdrawal is as easy as consenting.',
  treatments:'What you have had, and when the next visit is due.',
  'treatment-detail':'Notes, aftercare and photos for this visit.',
  photos:'Before-and-after tiles stay blurred until you reveal them.',
  health:'What the clinic holds, and how to tell us it changed.',
  settings:'Account, payments and how we hold your data.',
  payments:'Deposits and balances on your visits.',
  security:'Password, devices and who can sign in as you.',
  data:'Export, marketing preference and how to ask for erasure.',
  error:'Something failed to load. The page is still your portal.',
  'offer-detail':'Why you have this, and what it does not change.',
  'pay-sheet':'Pay the deposit that is holding this visit.',
  'pay-done':'Receipt for a completed payment.',
  'profile-checkin':'Confirm the health record before this visit.',
  'health-changed':'Send only the sections that changed.'
};
const tabFor = s => s.tab || 'dash';

const CHAT=`<div class="chatwrap">
  <div class="scrim" data-chat="0"></div>
  <div class="chat">
    <div class="chathead">
      <span class="dot"></span>
      <div class="stack"><div class="strong small">Ridgeway Skin Clinic</div><div class="tiny">Replies within 1 working day</div></div>
      <button class="x" data-chat="0" aria-label="Close messages">&times;</button>
    </div>
    <div class="chatbody">
      <div class="banner stop" style="margin-bottom:13px">Urgent? Call 020 7000 0000. Emergency? Call 999.</div>
      <div class="thread">
        <div class="bub them">Your lip filler consent form has been sent. Please review and sign it before your appointment.<div class="t">6 Mar, 11:20</div></div>
        <div class="bub me">Signed it just now. Quick question — I have a wedding on 12 April, is 19 March far enough ahead?<div class="t">6 Mar, 11:44</div></div>
        <div class="bub them">That is plenty of time. Swelling settles within a week for most people and you will be well past that.<div class="t">6 Mar, 14:02</div></div>
        <div class="bub them">One thing — do not book anything else facial in the two weeks before.<div class="t">6 Mar, 14:03 · Read</div></div>
      </div>
    </div>
    <div class="chatfoot">
      <div class="quick"><span class="chip">Reschedule</span><span class="chip">Aftercare question</span><span class="chip stop">Report a concern</span></div>
      <div class="row" style="gap:8px">
        <div class="inp" style="flex:1;border:1px solid var(--edge);background:var(--glass);border-radius:999px;min-height:42px;display:flex;align-items:center;padding:0 15px;color:var(--subtle);font-size:13.5px">Write a message</div>
        <button class="btn" style="width:42px;min-height:42px;padding:0;flex:none">&#8593;</button>
      </div>
    </div>
  </div>
</div>`;

const fabHtml = () => `<button class="fab" data-chat="1" aria-label="Messages, 1 unread"><span class="bub"></span><span class="n">1</span></button>`;

function navHtml(s){
  const flat=DNAV.flatMap(g=>g.items.map(i=>i.go));
  const active=flat.includes(current)?current:(TABS.find(x=>x.id===tabFor(s))||{}).go;
  return DNAV.map(g=>`<div class="nav-group"><h5>${g.h}</h5>`+g.items.map(i=>
    `<button class="nav-item" data-go="${i.go}" aria-current="${i.go===active}"><span class="nav-ico">${ICO[i.ico]}</span><span class="nav-label">${i.label}</span>${i.n?`<span class="n">${i.n}</span>`:''}</button>`
  ).join('')+`</div>`).join('');
}
function pageHead(s){
  if(!s.head) return '';
  const sub=s.sub || PAGE_SUB[current] || '';
  return `<header class="page-header">
    <div class="lead">
      ${s.back?`<button class="back" data-go="${s.back}" aria-label="Back">‹</button>`:''}
      <h1 class="page-title">${s.head}</h1>
      ${sub?`<p class="page-subtitle">${sub}</p>`:''}
    </div>
  </header>`;
}
function appChrome(s){
  const open=sidebarOpen;
  return `<div class="screen" data-shell="appshell-v04">
    <div class="shell ${open?'':'nav-closed'}">
      ${open && viewport==='mobile'?`<div class="aside-scrim" data-nav="0"></div>`:''}
      <aside class="aside" style="width:${sidebarWidth}px">
        <div class="aside-inner">
          <div class="aside-top">
            <button class="brand-lockup" data-go="dash-b" aria-label="Aetheria home">
              <span class="brand-mark">Æ</span><span class="brand-name">Aetheria</span>
            </button>
            <button class="icon-btn" data-nav="0" aria-label="Close sidebar">${ICO.panelClose}</button>
          </div>
          <nav class="aside-nav">${navHtml(s)}</nav>
        </div>
        ${viewport==='desktop'?`<div class="aside-resizer" data-resize="1" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" aria-valuemin="${SIDEBAR_MIN}" aria-valuemax="${SIDEBAR_MAX}" aria-valuenow="${sidebarWidth}"></div>`:''}
      </aside>
      <div class="maincol">
        <div class="canvas">
          <div class="toolbar">
            ${open?'':`<button class="icon-btn outline" data-nav="1" aria-label="Open sidebar" style="pointer-events:auto">${ICO.panel}</button>`}
            <div class="toolbar-end">
              <button class="tchip" data-chat="1" aria-label="Messages, 1 unread">${ICO.bell}<span class="dotn">1</span></button>
              <button class="acct" data-go="profile" aria-label="Account menu">
                <span class="av">AB</span>
                <span><span class="nm">Aisha Bello</span><span class="rl">Patient</span></span>
                <span class="chev">${ICO.chevron}</span>
              </button>
            </div>
          </div>
          <div class="canvas-inner">${pageHead(s)}${s.body}</div>
        </div>
      </div>
    </div>
    ${s.fab&&!chatOpen&&viewport==='mobile'?fabHtml():''}
    ${chatOpen?CHAT:''}
  </div>${s.modal?`<div class="modal">${s.modal}</div>`:''}`;
}
function mobileChrome(s){ return appChrome(s); }
function desktopChrome(s){ return appChrome(s); }
function bareChrome(s){
  return `<div class="screen bare">${s.body}</div>`;
}

function renderRail(){
  const g={}; ORDER.forEach(id=>{(g[SCREENS[id].group]=g[SCREENS[id].group]||[]).push(id)});
  rail.innerHTML=Object.entries(g).map(([name,ids])=>
    `<div class="railgroup"><h4>${name}</h4>`+ids.map(id=>
      `<button class="railitem" data-go="${id}" aria-current="${id===current}">${SCREENS[id].title}<em>${SCREENS[id].route}</em></button>`).join('')+`</div>`).join('');
  const opts=ORDER.map(id=>`<option value="${id}">${SCREENS[id].group} — ${SCREENS[id].title}</option>`).join('');
  ['screenjump','screenjump2'].forEach(id=>{
    const jump=document.getElementById(id);
    if(!jump) return;
    if(jump.options.length!==ORDER.length) jump.innerHTML=opts;
    jump.value=current;
  });
}
function renderNotes(s){
  notes.innerHTML=`<h3>${s.title}</h3><div class="route">${s.route}</div>`+
    (s.notes||[]).map(n=>`<div class="note ${n.k||''}"><div class="ref">${n.ref}</div><p>${n.t}</p></div>`).join('')+
    `<div class="legend"><b>Annotation colours</b>
      <span style="color:var(--meta)">Pink</span> — spec reference.
      <span style="color:var(--destructive-ink)">Red</span> — a gap in the code today.
      <span style="color:var(--consent-ink)">Lilac</span> — an open decision I have assumed an answer to.
      <span style="color:var(--success-ink)">Green</span> — new in v0.3 to match the clinic AppShell.
    </div>`;
}
function render(id){
  if(!SCREENS[id])return;
  current=id;
  const s=SCREENS[id];
  const chrome = s.chrome==='bare' ? bareChrome : (viewport==='mobile'?mobileChrome:desktopChrome);
  stage.innerHTML=`<div class="frame">${chrome(s)}</div>`;
  renderRail(); renderNotes(s);
  const label=`${ORDER.indexOf(id)+1} / ${ORDER.length}`;
  const atStart=ORDER.indexOf(id)===0;
  const atEnd=ORDER.indexOf(id)===ORDER.length-1;
  posEl.textContent=label;
  document.getElementById('pos2').textContent=label;
  document.getElementById('prev').disabled=atStart;
  document.getElementById('next').disabled=atEnd;
  document.getElementById('prev2').disabled=atStart;
  document.getElementById('next2').disabled=atEnd;
  document.getElementById('chatbtn').setAttribute('aria-pressed',String(chatOpen));
  carIdx=0;
  stage.scrollTop=0;
  if(location.hash.replace('#','')!==id) history.replaceState(null,'','#'+id);
  bindResize();
}
function bindResize(){
  const handle=document.querySelector('[data-resize]');
  const aside=document.querySelector('.aside');
  if(!handle||!aside) return;
  const apply=w=>{
    sidebarWidth=Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, Math.round(w)));
    aside.style.width=sidebarWidth+'px';
    handle.setAttribute('aria-valuenow',String(sidebarWidth));
  };
  apply(sidebarWidth);
  handle.onpointerdown=e=>{
    e.preventDefault();
    const startX=e.clientX, startW=sidebarWidth;
    const move=ev=>apply(startW + ev.clientX - startX);
    const up=()=>{
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  handle.ondblclick=()=>apply(SIDEBAR_DEFAULT);
  handle.onkeydown=e=>{
    if(e.key==='ArrowLeft'){ e.preventDefault(); apply(sidebarWidth-16); }
    if(e.key==='ArrowRight'){ e.preventDefault(); apply(sidebarWidth+16); }
  };
}
function slideTo(i){
  const track=document.querySelector('.ctrack'); if(!track) return;
  const n=track.children.length; carIdx=((i%n)+n)%n;
  track.style.transform='translateX(-'+(carIdx*100)+'%)';
  document.querySelectorAll('.cdot').forEach((d,k)=>d.setAttribute('aria-current',String(k===carIdx)));
}
document.addEventListener('click',e=>{
  const sl=e.target.closest('[data-slide]');
  if(sl){ e.preventDefault(); const v=sl.getAttribute('data-slide');
    slideTo(v==='next'?carIdx+1:v==='prev'?carIdx-1:parseInt(v,10)); return; }
  const ex=e.target.closest('[data-ext]');
  if(ex){ e.preventDefault();
    alert('Opens the clinic site in a new tab.\n\ntarget="_blank" rel="noopener noreferrer"\nNo patient identifiers in the URL.'); return; }
  const c=e.target.closest('[data-chat]');
  if(c){ e.preventDefault(); chatOpen = c.getAttribute('data-chat')==='1'; render(current); return; }
  const nv=e.target.closest('[data-nav]');
  if(nv){ e.preventDefault(); sidebarOpen = nv.getAttribute('data-nav')==='1'; render(current); return; }
  const t=e.target.closest('[data-go]');
  if(t){ e.preventDefault(); chatOpen=false; if(viewport==='mobile') sidebarOpen=false; render(t.getAttribute('data-go')); }
});
function goPrev(){const i=ORDER.indexOf(current);if(i>0)render(ORDER[i-1])}
function goNext(){const i=ORDER.indexOf(current);if(i<ORDER.length-1)render(ORDER[i+1])}
function setChromeMin(on){
  document.body.classList.toggle('chrome-min',on);
  try{localStorage.setItem('wf-chrome-min',on?'1':'0')}catch(err){}
}
document.getElementById('prev').onclick=goPrev;
document.getElementById('next').onclick=goNext;
document.getElementById('prev2').onclick=goPrev;
document.getElementById('next2').onclick=goNext;
document.getElementById('chromemin').onclick=()=>setChromeMin(true);
document.getElementById('chromeexpand').onclick=()=>setChromeMin(false);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&chatOpen){chatOpen=false;render(current);return}
  if(e.key==='Escape'&&!document.body.classList.contains('chrome-min')){setChromeMin(true);return}
  const typing=e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||e.target.isContentEditable);
  if(e.key==='[' && !e.metaKey && !e.ctrlKey && !e.altKey && !typing){
    e.preventDefault();
    sidebarOpen=!sidebarOpen;
    render(current);
    return;
  }
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  if(e.key==='ArrowRight')document.getElementById('next').click();
});
function setViewport(v){
  viewport=v; stage.className='stage '+v;
  sidebarOpen = v==='desktop';
  document.getElementById('vpm').setAttribute('aria-pressed',v==='mobile');
  document.getElementById('vpd').setAttribute('aria-pressed',v==='desktop');
  render(current);
}
document.getElementById('vpm').onclick=()=>setViewport('mobile');
document.getElementById('vpd').onclick=()=>setViewport('desktop');
document.getElementById('chatbtn').onclick=()=>{chatOpen=!chatOpen;render(current)};
document.getElementById('annot').onclick=e=>{
  const on=e.currentTarget.getAttribute('aria-pressed')==='true';
  e.currentTarget.setAttribute('aria-pressed',String(!on));
  document.body.classList.toggle('noannot',on);
};
document.getElementById('screens').onclick=e=>{
  const on=e.currentTarget.getAttribute('aria-pressed')==='true';
  e.currentTarget.setAttribute('aria-pressed',String(!on));
  document.body.classList.toggle('norail',on);
};
function jumpTo(e){
  if(ORDER.includes(e.target.value)) render(e.target.value);
}
document.getElementById('screenjump').onchange=jumpTo;
document.getElementById('screenjump2').onchange=jumpTo;
try{
  if(localStorage.getItem('wf-chrome-min')==='0') setChromeMin(false);
}catch(err){}
const boot=location.hash.replace('#','');
const bootParams=new URLSearchParams(location.search);
const bootVp=bootParams.get('vp');
if(bootParams.get('nav')==='closed') sidebarOpen=false;
if(bootVp==='mobile'||bootVp==='desktop') setViewport(bootVp);
render(ORDER.includes(boot)?boot:ORDER[0]);
window.addEventListener('hashchange',()=>{
  const id=location.hash.replace('#','');
  if(ORDER.includes(id)&&id!==current) render(id);
});
</script>
