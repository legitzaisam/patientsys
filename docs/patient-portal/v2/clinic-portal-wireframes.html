<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 Clinic Portal — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================== deck harness ============================== */
:root{
  --deck-bg:#20242b; --deck-panel:#2a2f38; --deck-ink:#e8eaef; --deck-mut:#9aa1ad;
  --deck-edge:rgba(255,255,255,.09); --deck-accent:#7fc4bd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--deck-bg);color:var(--deck-ink);overflow:hidden}
#stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:26px 26px 66px}
#stage{position:relative}
.frame{position:relative;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.35);transform-origin:top left}
/* browser chrome — macOS traffic lights + centred URL pill */
.bc-mac{height:56px;background:#f6f6f7;border-bottom:1px solid #e3e3e6;display:flex;align-items:center;padding:0 22px;gap:18px}
.bc-mac .lights{display:flex;gap:9px}
.bc-mac .lights i{width:14px;height:14px;border-radius:50%}
.bc-mac .lights i:nth-child(1){background:#f2605a}.bc-mac .lights i:nth-child(2){background:#f6bd3c}.bc-mac .lights i:nth-child(3){background:#61c355}
.bc-mac .navarr{display:flex;gap:12px;color:#a6a6ab;font-size:17px}
.bc-mac .urlpill{flex:1;max-width:640px;margin:0 auto;height:32px;background:#e9e9eb;border-radius:9px;
  display:flex;align-items:center;justify-content:center;gap:7px;color:#5f6066;font-size:14px}
.bc-mac .urlpill .lock{font-size:12px;color:#8b8b90}
.bc-mac .bicons{display:flex;gap:15px;color:#a6a6ab;font-size:16px}
/* browser chrome — full tab bar */
.bc-tab{background:#dfe1e5}
.bc-tab .tabrow{height:44px;display:flex;align-items:flex-end;padding:0 12px;gap:8px}
.bc-tab .tab{height:36px;background:#fff;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:9px;
  padding:0 14px;font-size:13.5px;color:#3c4043;min-width:270px}
.bc-tab .tab .fav{width:16px;height:16px;border-radius:50%;background:var(--tab-fav,#0b5355);flex:none}
.bc-tab .tab .x{margin-left:auto;color:#9aa0a6}
.bc-tab .tabplus{color:#5f6368;font-size:19px;padding:0 4px 6px}
.bc-tab .winbtns{margin-left:auto;display:flex;gap:20px;color:#5f6368;font-size:14px;padding-bottom:8px}
.bc-tab .toolrow{height:40px;background:#fff;border-bottom:1px solid #e3e3e6;display:flex;align-items:center;gap:14px;padding:0 14px}
.bc-tab .toolrow .arr{color:#5f6368;font-size:16px}
.bc-tab .toolrow .url{flex:1;height:29px;background:#f1f3f4;border-radius:15px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#202124;font-size:13.5px}
.bc-tab .toolrow .url .lock{color:#5f6368;font-size:12px}
.bc-tab .toolrow .ticons{display:flex;gap:14px;color:#5f6368;font-size:15px}
/* screen body fills the rest of the frame */
.sbody{position:relative;overflow:hidden}
/* rail */
#rail{position:fixed;left:0;top:0;bottom:0;width:308px;background:var(--deck-panel);border-right:1px solid var(--deck-edge);
  transform:translateX(-100%);transition:transform .22s ease;z-index:40;display:flex;flex-direction:column}
body.railopen #rail{transform:none}
#rail header{padding:18px 20px 10px;font-weight:700;font-size:15px}
#rail header small{display:block;color:var(--deck-mut);font-weight:500;margin-top:3px}
#rail .items{overflow:auto;padding:4px 12px 20px;flex:1}
#rail .vhead{margin:16px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--deck-accent)}
#rail .vhead small{display:block;color:var(--deck-mut);font-weight:500;text-transform:none;letter-spacing:0;margin-top:2px}
#rail button.item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--deck-ink);
  padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit}
#rail button.item:hover{background:rgba(255,255,255,.06)}
#rail button.item[aria-current="true"]{background:rgba(127,196,189,.16);color:#cfeeea}
#rail button.item em{display:block;font-style:normal;color:var(--deck-mut);font-size:12px;margin-top:1px}
/* dock */
#dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--deck-panel);
  border:1px solid var(--deck-edge);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45);
  display:flex;align-items:center;gap:10px;padding:8px 12px;white-space:nowrap}
#dock .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--deck-mut)}
#dock .pills{display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:9px;padding:3px}
#dock .pills button{border:0;background:none;color:var(--deck-mut);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:7px;cursor:pointer}
#dock .pills button[aria-pressed="true"]{background:rgba(127,196,189,.2);color:#d9f3ef}
#dock .step{display:flex;align-items:center;gap:8px}
#dock .step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--deck-edge);background:none;color:var(--deck-ink);cursor:pointer;font-size:14px}
#dock .step button:disabled{opacity:.35;cursor:default}
#dock #pos{font-size:12.5px;color:var(--deck-mut);min-width:52px;text-align:center}
#dock select{background:rgba(255,255,255,.06);color:var(--deck-ink);border:1px solid var(--deck-edge);border-radius:8px;
  height:30px;padding:0 8px;font:inherit;font-size:13px;max-width:250px}
#dock a.deck,#dock button.tools{border:1px solid var(--deck-edge);background:none;color:var(--deck-ink);border-radius:8px;
  height:30px;display:inline-flex;align-items:center;padding:0 12px;font-size:13px;text-decoration:none;cursor:pointer}
#dock a.deck:hover,#dock button.tools:hover{background:rgba(255,255,255,.06)}
/* screen-level shared bits */
.sbody ::-webkit-scrollbar{display:none}
.caveat{font-family:Caveat,cursive}
.serif{font-family:"Cormorant Garamond",serif}
/* ========================= CLINIC PORTAL (pastel) ========================= */
.v-pastel{--ink:#0a1c46;--slate:#44577f;--mut:#8996b7;--edge:#e9ecf1;--page:#f6f8f6;
  --mint:#e3f6f2;--mintink:#2e7d5b;--mintdot:#9ecebd;--pink:#fdebf4;--pinkink:#c2588a;--pinkstrong:#e8afc8;
  --blue:#ebf4fe;--blueink:#4a6fa5;--lav:#f2eefe;--lavink:#7a5fb8;--butter:#fae9be;--butterink:#6b5a1e;
  --cream:#f5f2ed;
  display:grid;grid-template-columns:245px 1fr;font-family:Inter,sans-serif;color:var(--ink);background:var(--page)}
.cp-side{background:#fdfdfd;border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:24px 18px 18px;overflow:hidden}
.cp-logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.cp-logo .mark{width:30px;height:30px;border-radius:50%;background:#eef4ee;display:flex;align-items:center;justify-content:center;color:#7fae8e;font-size:16px}
.cp-logo b{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600}
.cp-logo small{display:block;font-size:8px;letter-spacing:.3em;color:var(--mut)}
.cp-group{margin-top:22px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#9aa4bb;padding:0 8px}
.cp-nav{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.cp-nav a{display:flex;align-items:center;gap:12px;padding:9.5px 12px;border-radius:10px;color:#3d4c72;font-size:14px;font-weight:500;text-decoration:none}
.cp-nav a svg{width:17px;height:17px;stroke:#8b96ad;flex:none}
.cp-nav a.on{background:#ebf3ee;color:#1f5c46;font-weight:600}
.cp-nav a.on svg{stroke:#1f5c46}
.cp-nav .n{margin-left:auto;background:#eef1f6;color:#5b6a8f;font-size:11px;font-weight:700;border-radius:9px;padding:2px 8px}
.cp-team{display:flex;align-items:center;gap:11px;padding:7px 12px;font-size:13.5px;color:#3d4c72}
.cp-ava{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.cp-art{margin-top:auto;border-radius:13px;overflow:hidden;position:relative;height:210px;flex:none}
.cp-art img{width:100%;height:100%;object-fit:cover}
.cp-art .cap{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column}
.cp-art .cap b{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;color:#3c4a3f;line-height:1.25}
.cp-art .cap span{margin-top:auto;font-size:12px;color:#77826f;line-height:1.4}
.cp-main{display:flex;flex-direction:column;overflow:hidden}
.cp-top{height:56px;display:flex;align-items:center;gap:16px;padding:0 28px;background:transparent;flex:none}
.cp-search{width:330px;height:38px;border:1px solid var(--edge);border-radius:11px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 13px;color:#9aa4bb;font-size:13.5px}
.cp-search .k{margin-left:auto;border:1px solid var(--edge);border-radius:5px;font-size:10.5px;padding:1px 5px;color:#9aa4bb}
.cp-icons{margin-left:auto;display:flex;gap:16px;align-items:center;color:#5b6a8f}
.cp-icons .w{position:relative}
.cp-icons .w em{position:absolute;top:-6px;right:-7px;background:#e8657c;color:#fff;font-size:9px;font-weight:700;font-style:normal;
  border-radius:8px;padding:1px 4.5px}
.cp-me{display:flex;align-items:center;gap:10px}
.cp-me b{font-size:13.5px;display:block}
.cp-me small{color:var(--mut);font-size:11.5px}
.cp-content{flex:1;overflow:hidden;padding:6px 28px 20px;display:flex;flex-direction:column;min-height:0}
.cp-h1row{display:flex;align-items:flex-start;gap:14px;flex:none}
.cp-h1row h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:700}
.cp-h1row .sub{color:var(--slate);font-size:13.5px;margin-top:2px}
.cp-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.cp-datepill{border:1px solid var(--edge);background:#fff;border-radius:11px;height:38px;display:flex;align-items:center;gap:9px;padding:0 14px;font-size:13px;font-weight:600;color:#3d4c72}
.cp-seg{display:flex;background:#fff;border:1px solid var(--edge);border-radius:11px;padding:3px;height:38px}
.cp-seg span{font-size:12.5px;font-weight:600;color:#5b6a8f;padding:6px 15px;border-radius:8px;display:flex;align-items:center}
.cp-seg .on{background:var(--mint);color:#1f5c46}
.cp-btn{height:38px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;font-weight:600;border:1px solid var(--edge);background:#fff;color:#3d4c72}
.cp-btn.butter{background:var(--butter);border-color:#efd9a0;color:#5b4a17}
.cp-btn.green{background:#dff3e8;border-color:#c2e4d2;color:#1f5c46}
.cp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;flex:none}
.cp-stat{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:10px 14px;position:relative}
.cp-stat .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.cp-stat .ic svg{width:18px;height:18px}
.cp-stat small{color:var(--slate);font-size:12px}
.cp-stat .v{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.cp-stat .chips{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:nowrap}
.cp-stat .chev{position:absolute;right:14px;top:14px;color:#aab3c6}
.cp-uch{font-size:10.5px;font-weight:700;border-radius:12px;padding:2.5px 8px;white-space:nowrap}
.cp-uch.up{background:var(--mint);color:var(--mintink)}
.cp-uch.dn{background:var(--pink);color:var(--pinkink)}
.cp-uch.mut{color:var(--mut);font-weight:500;background:none;padding-left:0}
.cp-panel{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:11px 15px}
.cp-panel h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.cp-panel h3 svg{width:17px;height:17px;stroke:#5b6a8f}
.cp-panel .psub{color:var(--mut);font-size:12px;margin-top:3px}
.cp-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:12px;padding:3px 9px}
.cp-chip.mint{background:var(--mint);color:var(--mintink)}
.cp-chip.pink{background:var(--pink);color:var(--pinkink)}
.cp-chip.blue{background:var(--blue);color:var(--blueink)}
.cp-chip.lav{background:var(--lav);color:var(--lavink)}
.cp-chip.line{border:1px solid var(--edge);color:#5b6a8f;background:#fff;font-weight:600}
/* overview: appointments strip */
.cp-appts{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:12px}
.cp-appt{border:1px solid var(--edge);border-left:4px solid var(--ac,#f3b04c);border-radius:12px;padding:9px 12px;background:#fff}
.cp-appt .t{display:flex;font-size:12px;font-weight:700;color:#3d4c72}
.cp-appt .t .st{margin-left:auto}
.cp-appt b{display:block;font-size:14.5px;margin-top:5px}
.cp-appt .tr{color:var(--slate);font-size:12px;margin-top:1px}
.cp-appt .who{color:var(--mut);font-size:11.5px;margin-top:2px}
.cp-appt .row{display:flex;gap:6px;margin-top:9px;flex-wrap:nowrap}
/* attention + notes + tasks */
.cp-att-row{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-top:12px;flex:1;min-height:0}
.cp-attn .sec{margin-top:9px;border:1px solid var(--edge);border-radius:11px;overflow:hidden}
.cp-attn .sec .hd{display:flex;align-items:center;gap:8px;padding:5.5px 13px;font-size:12px;font-weight:700;background:#fbfbfc}
.cp-attn .sec .hd .n{margin-left:auto;font-size:11px;background:#eef1f6;border-radius:10px;padding:2px 9px;color:#5b6a8f}
.cp-attn .sec .hd.red{color:#c74f63}
.cp-attn .sec .hd.red .n{background:var(--pink);color:var(--pinkink)}
.cp-attn .li{display:flex;align-items:center;gap:9px;padding:4.5px 13px;border-top:1px solid #f2f4f7;font-size:12px;color:#3d4c72}
.cp-attn .li .n{margin-left:auto;font-size:11px;font-weight:700;background:#eef1f6;border-radius:10px;padding:2px 8px;color:#5b6a8f}
.cp-attn .li .n.red{background:var(--pink);color:var(--pinkink)}
.cp-notes .bar{display:flex;gap:12px;align-items:center;border:1px solid var(--edge);border-radius:9px;padding:7px 11px;margin-top:11px;color:#5b6a8f;font-size:12px}
.cp-notes h5{font-size:14.5px;font-weight:700;margin-top:13px}
.cp-notes ul{margin:8px 0 0 17px;color:#3d4c72;font-size:13px;line-height:1.75}
.cp-notes .ft{display:flex;margin-top:14px;color:var(--mut);font-size:11.5px}
.cp-notes .ft .ok{color:#3f9e68}
.cp-notes .ft span:last-child{margin-left:auto}
.cp-tasks .row{display:flex;align-items:center;gap:11px;padding:5.5px 0;border-top:1px solid #f2f4f7;font-size:12.3px}
.cp-tasks .row:first-of-type{border-top:0}
.cp-tasks .row b{display:block;font-size:13px}
.cp-tasks .row small{color:var(--mut);font-size:11.5px}
.cp-tasks .ics{margin-left:auto;display:flex;gap:10px;color:#8b96ad;align-items:center}
.cp-tasks .mk{font-size:11.5px;font-weight:600;color:#5b6a8f;border:1px solid var(--edge);border-radius:8px;padding:4px 9px}
/* diary */
.cp-legend{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--edge);border-radius:12px;padding:10px 16px;margin-top:12px;font-size:12.5px;color:#3d4c72;flex:none}
.cp-legend b{font-size:12.5px}
.cp-legend .it{display:flex;align-items:center;gap:7px}
.cp-legend .dot{width:9px;height:9px;border-radius:50%}
.cp-diary{background:#fff;border:1px solid var(--edge);border-radius:14px;margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 18px 10px}
.cp-diary .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);flex:none}
.cp-diary .hd b{color:var(--ink);font-size:14px}
.cp-diary .hd .vb{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px}
.cp-diary .hd select{border:1px solid var(--edge);border-radius:9px;height:32px;padding:0 10px;font:inherit;font-size:12.5px;color:#3d4c72;background:#fff}
.cp-planner{flex:1;display:grid;grid-template-columns:52px 1fr 1fr 1fr;column-gap:14px;margin-top:10px;min-height:0;position:relative}
.cp-col .cohead{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#28355c;padding:5px 4px 8px;border-bottom:1px solid var(--edge);height:41px;box-sizing:border-box}
.cp-col .cohead .n{margin-left:auto;color:var(--mut);font-weight:600;font-size:12px}
.cp-gutter{padding-top:40px;color:#9aa4bb;font-size:10.5px;text-align:right;padding-right:6px}
.cp-gutter div{height:52px}
.cp-lanes{position:relative;height:calc(100% - 41px)}
.cp-block{position:absolute;left:0;right:8px;border-radius:9px;padding:7px 10px;font-size:11px;border-left:4px solid var(--bc);background:var(--bg)}
.cp-block .bt{display:flex;gap:6px;color:#42506e;font-weight:600;font-size:10.5px}
.cp-block .bt .bi{margin-left:auto;display:flex;gap:5px;color:#7d88a3}
.cp-block b{display:block;font-size:12px;margin-top:2px;color:#1d2a4d}
.cp-block small{color:#5f6c8c;font-size:10.5px}
.cp-quiet{flex:none;color:var(--mut);font-size:11.5px;padding:8px 4px 0;border-top:1px solid var(--edge);margin-top:8px}
/* patients table */
.cp-filters{display:flex;gap:8px;margin-top:12px;flex:none}
.cp-fp{border:1px solid var(--edge);background:#fff;border-radius:18px;font-size:12.5px;font-weight:600;color:#5b6a8f;padding:7px 16px}
.cp-fp.on{background:var(--mint);border-color:#c9e8dd;color:#1f5c46}
.cp-table{background:#fff;border:1px solid var(--edge);border-radius:14px;margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cp-table table{width:100%;border-collapse:collapse;font-size:12.8px}
.cp-table th{text-align:left;color:#6b7894;font-weight:600;font-size:12px;padding:12px 16px;border-bottom:1px solid var(--edge);white-space:nowrap}
.cp-table td{padding:9.5px 16px;border-bottom:1px solid #f2f4f7;color:#42506e;white-space:nowrap}
.cp-table td b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.cp-table td small{color:var(--mut);font-size:11.5px}
.cp-pg{display:flex;align-items:center;padding:11px 16px;color:var(--mut);font-size:12px;margin-top:auto}
.cp-pg .pages{margin-left:auto;display:flex;gap:5px;align-items:center}
.cp-pg .pages span{min-width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;color:#5b6a8f;font-weight:600;font-size:12px}
.cp-pg .pages .on{background:var(--mint);color:#1f5c46}
.cp-pg .pages .ar{border:1px solid var(--edge)}
/* patient record */
.cp-bc{color:#7fae8e;font-size:12.5px;margin-top:2px;flex:none}
.cp-recgrid{display:grid;grid-template-columns:1fr 262px;gap:14px;margin-top:10px;flex:1;min-height:0;overflow:hidden}
.cp-reccol{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.cp-rechead{display:flex;gap:14px;align-items:flex-start}
.cp-rechead .gtile{width:58px;height:58px;border-radius:14px;background:var(--butter);color:#7a5f18;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.cp-rechead h2{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:700}
.cp-rechead .meta{color:var(--slate);font-size:12px;margin-top:3px}
.cp-rechead .meta2{color:var(--mut);font-size:11.5px;margin-top:2px}
.cp-rechead .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.cp-3cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.cp-vital{border-radius:11px;padding:11px 13px;display:flex;gap:10px;align-items:center;font-size:12px}

.cp-vital b{font-size:13px}

.cp-prefrow small{color:var(--mut);font-size:11.3px}
.cp-tgl{margin-left:auto;width:38px;height:21px;border-radius:11px;background:#96c5af;position:relative;flex:none}

.cp-tgl.off{background:#dfe3ea}

.cp-inline-info{background:#eff5fb;border:1px solid #dbe7f5;color:#54719c;border-radius:9px;padding:9px 12px;font-size:12px;display:flex;gap:8px;margin-top:10px}
.cp-tabs{display:flex;gap:8px}
.cp-tab{border:1px solid var(--edge);background:#fff;border-radius:16px;font-size:12px;font-weight:600;color:#5b6a8f;padding:6px 14px;display:flex;gap:7px;align-items:center}
.cp-tab.on{background:var(--mint);border-color:#c9e8dd;color:#1f5c46}
.cp-tab .n{background:#d9efe6;border-radius:8px;font-size:10.5px;padding:1px 7px}
.cp-hrow{display:flex;align-items:center;gap:10px;padding:8.5px 0;border-top:1px solid #f2f4f7;font-size:12.5px}
.cp-hrow:first-of-type{border-top:0}
.cp-hrow b{display:block;font-size:12.8px}
.cp-hrow small{color:var(--mut);font-size:11.3px}
.cp-hrow .d{margin-left:auto;color:var(--slate);font-size:12px;white-space:nowrap}
.cp-msgs{background:#fff;border:1px solid var(--edge);border-radius:14px;display:flex;flex-direction:column;padding:14px;min-height:0}
.cp-msgs .who{display:flex;gap:10px;align-items:center}
.cp-msgs .who .cp-ava{width:34px;height:34px;font-size:12px}
.cp-msgs .who b{font-size:13.5px;display:block}
.cp-msgs .who small{color:var(--mut);font-size:11.3px}
.cp-msgs .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:11.5px;text-align:center;gap:8px}
.cp-msgs .inp{border:1px solid var(--edge);border-radius:10px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut);font-size:12.5px}
.cp-msgs .inp .snd{margin-left:auto;color:#4f9c74}
/* performance */
.cp-trend{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:9px}
.cp-chart{background:#fff;border:1px solid var(--edge);border-radius:13px;padding:10px 14px}
.cp-chart h4{font-size:13.5px;font-weight:700}
.cp-chart .csub{color:var(--mut);font-size:11px;margin-top:1px}
.cp-chart .leg{position:absolute;right:14px;top:13px;display:flex;gap:11px;font-size:10.5px;color:#5b6a8f}
.cp-chart{position:relative}
.cp-chart .leg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.cp-kpi{background:#fff;border:1px solid var(--edge);border-radius:13px;margin-top:11px}
.cp-kpi .top{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--edge)}
.cp-kpi .top .ic{width:36px;height:36px;border-radius:10px;background:var(--mint);color:var(--mintink);display:flex;align-items:center;justify-content:center}
.cp-kpi .top b{font-size:13.5px;display:block}
.cp-kpi .top small{color:var(--mut);font-size:11.5px}
.cp-kpi table{width:100%;border-collapse:collapse;font-size:12.3px}
.cp-kpi th{text-align:left;color:#6b7894;font-weight:600;font-size:11.5px;padding:6px 16px;border-bottom:1px solid var(--edge)}
.cp-kpi td{padding:6px 16px;border-bottom:1px solid #f2f4f7;color:#42506e}
.cp-kpi .out{color:#d4728f;text-decoration:underline}
/* ===================== SKIN CLINIC (journey-led green) ===================== */
.v-journey{--ink:#0b1f4d;--slate:#5a6787;--mut:#8a94aa;--edge:#e7eaef;--page:#f6f7f8;
  --deep:#01565a;--teal:#2c8f8a;--mint:#ddf4e9;--mintink:#237a55;--pink:#fde4ec;--pinkink:#c25a7d;
  --cream:#fdf4e4;--creamink:#9a7420;--blue:#e5effd;--blueink:#4a6fa5;
  display:grid;grid-template-columns:232px 1fr;font-family:Inter,sans-serif;color:var(--ink);background:var(--page)}
.cj-side{background:#fefefe;border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:22px 16px 16px;overflow:hidden}
.cj-logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.cj-logo .mark{width:28px;height:28px;border-radius:50%;background:#f7e8df;display:flex;align-items:center;justify-content:center;color:#d0997e;font-size:13px}
.cj-logo b{font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:600}
.cj-logo small{display:block;font-size:8px;letter-spacing:.28em;color:var(--mut)}
.cj-group{margin-top:20px;font-size:11px;font-weight:700;color:#2c8f8a;padding:0 8px}
.cj-nav{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.cj-nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#3d4c72;font-size:13.5px;font-weight:500;text-decoration:none}
.cj-nav a svg{width:16px;height:16px;stroke:#8b96ad;flex:none}
.cj-nav a.on{background:#e5f4f4;color:var(--deep);font-weight:600}
.cj-nav a.on svg{stroke:var(--deep)}
.cj-nav .n{margin-left:auto;background:#eef1f6;color:#5b6a8f;font-size:11px;font-weight:700;border-radius:9px;padding:1px 8px}
.cj-team{display:flex;align-items:center;gap:10px;padding:6.5px 12px;font-size:13px;color:#3d4c72}
.cj-art{margin-top:auto;border-radius:13px;overflow:hidden;position:relative;height:200px;flex:none}
.cj-art img{width:100%;height:100%;object-fit:cover}
.cj-art .cap{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column}
.cj-art .cap b{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600;color:#4a4038;line-height:1.25}
.cj-art .cap span{margin-top:auto;font-size:12px;color:#8a7c6c;line-height:1.4}
.cj-main{display:flex;flex-direction:column;overflow:hidden}
.cj-top{height:58px;display:flex;align-items:center;gap:15px;padding:0 26px;flex:none}
.cj-search{width:340px;height:36px;border:1px solid var(--edge);border-radius:10px;background:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;color:#9aa4bb;font-size:13px}
.cj-script{margin-left:auto;font-family:Caveat;font-size:20px;color:#b3a893;transform:rotate(-5deg)}
.cj-bell{position:relative;color:#5b6a8f}
.cj-bell em{position:absolute;top:-6px;right:-7px;background:#e8657c;color:#fff;font-size:9px;font-weight:700;font-style:normal;border-radius:8px;padding:1px 4.5px}
.cj-me{display:flex;align-items:center;gap:9px}
.cj-me b{font-size:13px;display:block}.cj-me small{color:var(--mut);font-size:11px}
.cj-content{flex:1;overflow:hidden;padding:4px 26px 18px;display:flex;flex-direction:column;min-height:0}
.cj-h1row{display:flex;align-items:flex-start;gap:14px;flex:none}
.cj-h1row h1{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:700}
.cj-h1row .sub{color:var(--slate);font-size:13px;margin-top:2px}
.cj-right{margin-left:auto;display:flex;gap:9px;align-items:center}
.cj-pill{border:1px solid var(--edge);background:#fff;border-radius:10px;height:36px;display:flex;align-items:center;gap:8px;padding:0 13px;font-size:12.5px;font-weight:600;color:#3d4c72}
.cj-cta{height:36px;border-radius:10px;background:var(--deep);color:#fff;display:inline-flex;align-items:center;gap:8px;padding:0 15px;font-size:12.5px;font-weight:600}
.cj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:10px;flex:none}
.cj-stat{background:#fff;border:1px solid var(--edge);border-radius:13px;padding:10px 13px;display:flex;gap:10px}
.cj-stat .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.cj-stat .ic svg{width:18px;height:18px}
.cj-stat small{color:var(--slate);font-size:11.5px;display:block}
.cj-stat .v{font-size:22px;font-weight:800;margin-top:1px}
.cj-stat .foot{color:var(--mut);font-size:10.5px;margin-top:3px}
.cj-uch{font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;margin-left:6px;vertical-align:3px}
.cj-uch.up{background:var(--mint);color:var(--mintink)}
.cj-uch.dn{background:var(--pink);color:var(--pinkink)}
.cj-uch.blue{background:var(--blue);color:var(--blueink)}
.cj-panel{background:#fff;border:1px solid var(--edge);border-radius:13px;padding:11px 14px}
.cj-panel h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.cj-panel h3 .see{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--deep)}
.cj-panel .psub{color:var(--mut);font-size:11.5px;margin-top:2px}
.cj-chip{display:inline-flex;align-items:center;gap:4px;font-size:9.8px;font-weight:700;border-radius:11px;padding:2.5px 7px;white-space:nowrap}
.cj-chip.mint{background:var(--mint);color:var(--mintink)}
.cj-chip.pink{background:var(--pink);color:var(--pinkink)}
.cj-chip.cream{background:var(--cream);color:var(--creamink)}
.cj-chip.blue{background:var(--blue);color:var(--blueink)}
.cj-chip.deep{background:var(--deep);color:#fff}
.cj-chip.slate{background:#eef0f4;color:#66708a}
/* overview: appt cards */
.cj-appts{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:10px}
.cj-appt{border:1px solid var(--edge);border-radius:12px;padding:8px 10px;background:#fff}
.cj-appt .t{display:flex;font-size:11.5px;font-weight:700;color:#3d4c72}
.cj-appt .t .st{margin-left:auto}
.cj-appt .who{display:flex;gap:9px;margin-top:8px}
.cj-appt .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.cj-appt .who b{font-size:13px;display:block}
.cj-appt .who small{display:block;color:var(--slate);font-size:10.8px}
.cj-appt .dr{color:var(--mut);font-size:10.8px;margin-top:6px}
.cj-appt .row{display:flex;gap:5px;margin-top:8px;flex-wrap:nowrap}
/* support queue */
.cj-queue{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:10px}
.cj-qcol{border:1px solid var(--edge);border-radius:11px;overflow:hidden}
.cj-qcol .qh{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:12px;font-weight:700}
.cj-qcol .qh .n{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.7);border-radius:9px;padding:1px 8px}
.cj-qrow{display:flex;align-items:center;gap:8px;padding:5px 11px;border-top:1px solid #f2f4f7;font-size:11.5px;background:#fff}
.cj-qrow .cj-ava{width:26px;height:26px;border-radius:50%;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cj-qrow b{display:block;font-size:12px}
.cj-qrow small{color:var(--mut);font-size:10.5px}
.cj-qrow .d{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap}
/* snapshot */
.cj-snap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:10px}
.cj-scol{border:1px solid var(--edge);border-radius:11px;padding:10px 13px}
.cj-scol .sh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.cj-scol .sh .ic{width:26px;height:26px;border-radius:8px;background:var(--mint);color:var(--mintink);display:flex;align-items:center;justify-content:center}
.cj-scol .sh .n{margin-left:auto;font-size:10.5px;color:var(--mut);font-weight:500}
.cj-scol .sub2{color:var(--mut);font-size:10.5px;margin-top:1px}
.cj-srow{display:flex;align-items:center;gap:8px;margin-top:5.5px;font-size:11.5px}
.cj-srow img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none}
.cj-srow .bar{flex:1;height:6px;background:#e8edf0;border-radius:4px;overflow:hidden}
.cj-srow .bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.cj-srow .frac{color:var(--mut);font-size:10.5px;white-space:nowrap}
/* notes */
.cj-notes li{display:flex;gap:8px;font-size:11.8px;color:#3d4c72;line-height:1.45;padding:4px 0;list-style:none}
.cj-notes li::before{content:"";width:7px;height:7px;border-radius:50%;background:#57b596;flex:none;margin-top:5px}
/* patient journey screen */
.cj-rechead{display:flex;gap:13px;align-items:flex-start}
.cj-rechead .gtile{width:52px;height:52px;border-radius:13px;background:#fae9be;color:#7a5f18;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.cj-rechead h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;display:inline}
.cj-rechead .meta{color:var(--slate);font-size:11.8px;margin-top:3px}
.cj-tabs{display:flex;gap:26px;font-size:13px;color:#66708a;border-bottom:1px solid var(--edge);margin-top:10px;flex:none}
.cj-tabs span{padding:8px 2px;position:relative}
.cj-tabs .on{font-weight:700;color:var(--ink)}
.cj-tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--deep)}
.cj-steps{position:relative;padding-left:30px;min-width:0}
.cj-steps::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:#dfe8ea}
.cj-step{display:flex;align-items:center;gap:9px;padding:3px 8px 3px 0;border-bottom:1px solid #f0f3f5;position:relative;font-size:12px;min-height:30px}
.cj-step:last-child{border-bottom:0}
.cj-step .dot{position:absolute;left:-28px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid #cfdcdc;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#7f8ba0}
.cj-step.done .dot,.cj-step.cur .dot{background:var(--teal);border-color:var(--teal)}
.cj-step.done .dot svg,.cj-step.cur .dot svg{width:10px;height:10px;stroke:#fff}
.cj-step.cur{background:var(--mint);border-radius:9px;margin-left:-10px;padding-left:10px;border-bottom:0}
.cj-step.cond .dot{border-style:dashed}
.cj-step b{font-weight:600;font-size:11.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.cj-step .date{margin-left:auto;color:var(--mut);font-size:10.8px;flex:none}
.cj-month h4{font-size:13.5px;font-weight:700;line-height:1.25}
.cj-month h4 small{display:block;color:var(--teal);font-size:11px;font-weight:700;margin-bottom:2px}
.cj-month p{color:var(--mut);font-size:11px;line-height:1.4;margin-top:5px}
.cj-month .prog{margin-top:8px;font-size:11px;color:#55617a;font-weight:600}
.cj-month .bar{height:5px;background:#e8edf0;border-radius:3px;margin-top:5px;overflow:hidden;width:104px}
.cj-month .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.cj-check label{display:flex;align-items:center;gap:9px;font-size:11.8px;color:#43506a;padding:3.5px 0}
.cj-check .box{width:15px;height:15px;border:1.5px solid #c3ccd8;border-radius:4px;flex:none}
.cj-check label.don .box{background:var(--teal);border-color:var(--teal);position:relative}
.cj-check label.don .box::after{content:"✓";color:#fff;font-size:9.5px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cj-btn{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:600;border:1px solid var(--edge);color:#2e3c56;background:#fff}
.cj-btn.deep{background:var(--deep);border-color:var(--deep);color:#fff}
.cj-btn.deep svg{stroke:#fff}
.cj-focus{background:#fffdf7;border:1px solid #f0e4c8}
.cj-hrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid #f2f4f7;font-size:11.8px}
.cj-hrow:first-of-type{border-top:0}
.cj-hrow .d{margin-left:auto;color:var(--mut);font-size:10.8px;white-space:nowrap}
.cj-photos{display:flex;gap:8px;margin-top:8px}
.cj-photos .ph{flex:1}
.cj-photos img{width:100%;height:56px;object-fit:cover;border-radius:8px}
.cj-photos .lb{font-size:9.8px;color:var(--mut);margin-top:3px;line-height:1.3;text-align:center}
.cj-photos .add{flex:1;border:1.5px dashed #ccd4d6;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa6ab;font-size:16px;min-height:64px}
/* retention screen */
.cj-funnel{display:flex;gap:14px;align-items:flex-end;margin-top:14px;padding:0 6px}
.cj-fbar{flex:1;text-align:center}
.cj-fbar .pct{font-size:14px;font-weight:800;margin-bottom:5px}
.cj-fbar .bar{border-radius:8px;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;padding-bottom:7px}
.cj-fbar .lbl{font-size:10.8px;color:#55617a;margin-top:7px;line-height:1.3}
.cj-fbar .lbl b{display:block;font-size:11.5px;color:var(--ink)}
.cj-focusrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid #f2f4f7;font-size:11.8px;align-items:flex-start}
.cj-focusrow:first-of-type{border-top:0}
.cj-focusrow .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.cj-focusrow b{display:block;font-size:12px}
.cj-focusrow small{color:var(--mut);font-size:10.8px;line-height:1.4}
.cj-focusrow .chev{margin-left:auto;color:#aab3c6}
.cj-rtable{width:100%;border-collapse:collapse;font-size:11.8px;margin-top:8px}
.cj-rtable th{text-align:left;color:#6b7894;font-weight:600;font-size:10.5px;padding:6px 6px;border-bottom:1px solid var(--edge);white-space:nowrap}
.cj-rtable td{padding:6px 6px;border-bottom:1px solid #f2f4f7;color:#42506e;white-space:nowrap;font-size:11.2px}
.cj-obar{display:grid;grid-template-columns:26px 1.15fr 46px 1fr 40px 36px;gap:8px;align-items:center;font-size:11.8px;padding:7px 0;border-top:1px solid #f2f4f7}
.cj-obar:first-of-type{border-top:0}
.cj-obar .bar{height:7px;background:#e8edf0;border-radius:4px;overflow:hidden}
.cj-obar .bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.cj-banner{margin-top:10px;background:var(--mint);border-radius:10px;padding:10px 13px;font-size:11.5px;color:#23604a;display:flex;gap:9px}
.cj-banner b{display:block;font-size:12px;margin-bottom:2px}
/* ================= ADVANCED SKIN HEALTH (top nav, 16:9) ================== */
.v-advanced{--ink:#16323a;--slate:#5a6a72;--mut:#848f98;--edge:#e2e6e8;--paper:#f5f4f3;

.ca-nav{height:56px;background:#fdfdfd;border-bottom:1px solid var(--edge);display:flex;align-items:center;padding:0 34px;gap:38px;flex:none}
.ca-logo{display:flex;align-items:center;gap:10px}
.ca-logo .lf{color:#7ba889;font-size:22px;transform:rotate(-12deg)}
.ca-logo b{font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:600;letter-spacing:.2em}

/* ---- chart builders (inline SVG, no dependencies) ---- */
function chartPath(vals,w,h,pad,max){
  const n=vals.length,ix=i=>pad+i*(w-2*pad)/(n-1),iy=v=>h-pad-(v/max)*(h-2*pad);
  return vals.map((v,i)=>`${i?"L":"M"}${ix(i).toFixed(1)},${iy(v).toFixed(1)}`).join(" ");
}
const EARN=[1800,2600,2200,3400,3050,4100,3600,4600,4200,3300,3800,4400,3900,3200,3600,4200,4800,4100,3500,3900,3400,2900,3300,3700,3100,3500,3900,3300,2800,3200];
const COLL=EARN.map((v,i)=>v*0.62+((i*37)%400)-200);
const APPT=[9,14,11,17,13,19,15,10,16,12,18,14,20,11,15,17,13,19,22,14,10,16,12,18,15,21,13,17,11,15];
const ATT=[82,75,88,70,85,78,92,74,86,80,72,84,90,78,76,88,70,82,86,74,90,80,84,72,88,76,82,86,78,84];
const NOSH=[1,0,2,1,0,3,1,2,0,1,4,2,1,0,2,1,3,0,1,2,0,1,2,3,1,0,2,1,0,1];

function svgLineChart(o){
  const w=560,h=148,pad=36;
  const grid=[0,1,2,3].map(i=>{const y=pad+i*(h-2*pad)/3;return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#eef1f4"/>`;}).join("");
  let body="";
  if(o.type==="line"){
    body=(o.series||[]).map(s=>{
      const p=chartPath(s.vals,w,h,pad,o.max);
      const fill=s.fill?`<path d="${p} L${w-pad},${h-pad} L${pad},${h-pad} Z" fill="${s.fill}" opacity=".35"/>`:"";
      return `${fill}<path d="${p}" fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?`stroke-dasharray="5 4"`:""}/>`;
    }).join("");
    if(o.marker){const i=o.marker.i,n=o.series[0].vals.length;
      const x=pad+i*(w-2*pad)/(n-1),y=h-pad-(o.series[0].vals[i]/o.max)*(h-2*pad);
      body+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="${o.series[0].c}" stroke-width="2.5"/>
      <g transform="translate(${x-44},${y-46})"><rect width="88" height="34" rx="7" fill="#fff" stroke="#e4e8ee"/>
      <text x="44" y="14" text-anchor="middle" font-size="9" fill="#8996b7">${o.marker.l1}</text>
      <text x="44" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#0a1c46">${o.marker.l2}</text></g>`;}
  }else{
    const n=o.vals.length,bw=(w-2*pad)/n*0.55;
    body=o.vals.map((v,i)=>{const x=pad+i*(w-2*pad)/n,bh=(v/o.max)*(h-2*pad);
      return `<rect x="${x.toFixed(1)}" y="${(h-pad-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${o.c}"/>
        ${o.c2?`<rect x="${(x+bw+1.5).toFixed(1)}" y="${(h-pad-bh*0.72).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${(bh*0.72).toFixed(1)}" rx="2.5" fill="${o.c2}"/>`:""}`;
    }).join("");
  }
  const ylab=(o.ylab||[]).map((t,i)=>`<text x="${pad-5}" y="${h-pad-i*(h-2*pad)/((o.ylab.length-1)||1)+3}" text-anchor="end" font-size="8.5" fill="#9aa4bb">${t}</text>`).join("");
  const xlab=["1 Sep","5 Sep","9 Sep","13 Sep","17 Sep","21 Sep","25 Sep","30 Sep"].map((t,i)=>`<text x="${pad+i*(w-2*pad)/7}" y="${h-8}" text-anchor="middle" font-size="8.5" fill="#9aa4bb">${t}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;display:block;margin-top:6px">${grid}${body}${ylab}${xlab}</svg>`;
}

<script>
/* ------------------------------ deck engine ------------------------------ */
const stage=document.getElementById("stage"), railItems=document.getElementById("railitems"),
      pills=document.getElementById("vpills"), jump=document.getElementById("jump"),
      posEl=document.getElementById("pos");
let current=null;

function frameSize(s){return s.frame==="16:9"?{w:1672,h:941}:{w:1448,h:1086};}

function browserChrome(s){
  if(s.chrome==="mac")return `<div class="bc-mac"><div class="lights"><i></i><i></i><i></i></div>
    <div class="navarr">&#8249;&nbsp;&nbsp;&#8250;</div>
    <div class="urlpill"><span class="lock">&#128274;</span>${s.url||""}</div>
    <div class="bicons">&#8679;&nbsp;&nbsp;+&nbsp;&nbsp;&#9881;&nbsp;&nbsp;&#10064;</div></div>`;
  if(s.chrome==="tab")return `<div class="bc-tab" style="--tab-fav:${s.fav||"#0b5355"}">
    <div class="tabrow"><div class="tab"><span class="fav"></span>${s.tabTitle||s.title}<span class="x">&times;</span></div>
    <span class="tabplus">+</span><div class="winbtns"><span>&#8211;</span><span>&#9633;</span><span>&times;</span></div></div>
    <div class="toolrow"><span class="arr">&larr;</span><span class="arr">&rarr;</span><span class="arr">&#8635;</span>
    <div class="url"><span class="lock">&#128274;</span>${s.url||""}</div>
    <div class="ticons"><span>&#9734;</span><span>&#8942;</span></div></div></div>`;
  return "";
}

function fit(){
  const f=stage.querySelector(".frame"); if(!f)return;
  const s=SCREENS[current], sz=frameSize(s);
  const availW=innerWidth-52, availH=innerHeight-92;
  const k=Math.min(availW/sz.w, availH/sz.h, 1);
  f.style.transform=`scale(${k})`;
  stage.style.width=(sz.w*k)+"px"; stage.style.height=(sz.h*k)+"px";
}

function render(id){
  if(!SCREENS[id])return;
  current=id;
  const s=SCREENS[id], sz=frameSize(s);
  const chromeH=s.chrome==="mac"?56:s.chrome==="tab"?84:0;
  stage.innerHTML=`<div class="frame" style="width:${sz.w}px;height:${sz.h}px">
    ${browserChrome(s)}
    <div class="sbody v-${s.version}" style="height:${sz.h-chromeH}px">${s.html}</div></div>`;
  fit();
  const i=ORDER.indexOf(id);
  posEl.textContent=`${i+1} / ${ORDER.length}`;
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===ORDER.length-1;
  jump.value=id;
  document.querySelectorAll("#railitems .item").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  document.querySelectorAll("#vpills button").forEach(b=>b.setAttribute("aria-pressed",String(SCREENS[id].version===b.dataset.v)));
  history.replaceState(null,"","#"+id);
  document.title=`${VERSIONS[s.version].label} — ${s.title} · V2 Clinic Portal`;
}

function buildNav(){
  const byV={};
  ORDER.forEach(id=>{(byV[SCREENS[id].version]=byV[SCREENS[id].version]||[]).push(id);});
  railItems.innerHTML=Object.entries(byV).map(([v,ids])=>`
    <div class="vhead">${VERSIONS[v].label}<small>${VERSIONS[v].sub}</small></div>`+
    ids.map(id=>`<button class="item" data-go="${id}">${SCREENS[id].title}<em>${SCREENS[id].route}</em></button>`).join("")
  ).join("");
  railItems.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)render(b.dataset.go);});
  pills.innerHTML=Object.entries(byV).map(([v])=>`<button data-v="${v}">${VERSIONS[v].label}</button>`).join("");
  pills.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)render(byV[b.dataset.v][0]);});
  jump.innerHTML=ORDER.map(id=>`<option value="${id}">${VERSIONS[SCREENS[id].version].label} — ${SCREENS[id].title}</option>`).join("");
  jump.addEventListener("change",()=>render(jump.value));
}

document.getElementById("prev").onclick=()=>{const i=ORDER.indexOf(current);if(i>0)render(ORDER[i-1]);};
document.getElementById("next").onclick=()=>{const i=ORDER.indexOf(current);if(i<ORDER.length-1)render(ORDER[i+1]);};
document.getElementById("railbtn").onclick=()=>document.body.classList.toggle("railopen");
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")document.getElementById("prev").click();
  if(e.key==="ArrowRight")document.getElementById("next").click();
  if(e.key==="Escape")document.body.classList.remove("railopen");
});
addEventListener("resize",fit);
buildNav();
render(location.hash&&SCREENS[location.hash.slice(1)]?location.hash.slice(1):ORDER[0]);
</script>
</body>
