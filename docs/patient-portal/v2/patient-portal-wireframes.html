<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 Patient Portal — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================== deck harness ============================== */
:root{
  --deck-bg:#20242b; --deck-panel:#2a2f38; --deck-ink:#e8eaef; --deck-mut:#9aa1ad;
  --deck-edge:rgba(255,255,255,.09); --deck-accent:#7fc4bd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--deck-bg);color:var(--deck-ink);overflow:hidden}
#stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:26px 26px 66px}
#stage{position:relative}
.frame{position:relative;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.35);transform-origin:top left}
/* browser chrome — macOS traffic lights + centred URL pill */
.bc-mac{height:56px;background:#f6f6f7;border-bottom:1px solid #e3e3e6;display:flex;align-items:center;padding:0 22px;gap:18px}
.bc-mac .lights{display:flex;gap:9px}
.bc-mac .lights i{width:14px;height:14px;border-radius:50%}
.bc-mac .lights i:nth-child(1){background:#f2605a}.bc-mac .lights i:nth-child(2){background:#f6bd3c}.bc-mac .lights i:nth-child(3){background:#61c355}
.bc-mac .navarr{display:flex;gap:12px;color:#a6a6ab;font-size:17px}
.bc-mac .urlpill{flex:1;max-width:640px;margin:0 auto;height:32px;background:#e9e9eb;border-radius:9px;
  display:flex;align-items:center;justify-content:center;gap:7px;color:#5f6066;font-size:14px}
.bc-mac .urlpill .lock{font-size:12px;color:#8b8b90}
.bc-mac .bicons{display:flex;gap:15px;color:#a6a6ab;font-size:16px}
/* browser chrome — full tab bar */
.bc-tab{background:#dfe1e5}
.bc-tab .tabrow{height:44px;display:flex;align-items:flex-end;padding:0 12px;gap:8px}
.bc-tab .tab{height:36px;background:#fff;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:9px;
  padding:0 14px;font-size:13.5px;color:#3c4043;min-width:270px}
.bc-tab .tab .fav{width:16px;height:16px;border-radius:50%;background:var(--tab-fav,#0b5355);flex:none}
.bc-tab .tab .x{margin-left:auto;color:#9aa0a6}
.bc-tab .tabplus{color:#5f6368;font-size:19px;padding:0 4px 6px}
.bc-tab .winbtns{margin-left:auto;display:flex;gap:20px;color:#5f6368;font-size:14px;padding-bottom:8px}
.bc-tab .toolrow{height:40px;background:#fff;border-bottom:1px solid #e3e3e6;display:flex;align-items:center;gap:14px;padding:0 14px}
.bc-tab .toolrow .arr{color:#5f6368;font-size:16px}
.bc-tab .toolrow .url{flex:1;height:29px;background:#f1f3f4;border-radius:15px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#202124;font-size:13.5px}
.bc-tab .toolrow .url .lock{color:#5f6368;font-size:12px}
.bc-tab .toolrow .ticons{display:flex;gap:14px;color:#5f6368;font-size:15px}
/* screen body fills the rest of the frame */
.sbody{position:relative;overflow:hidden}
/* rail */
#rail{position:fixed;left:0;top:0;bottom:0;width:308px;background:var(--deck-panel);border-right:1px solid var(--deck-edge);
  transform:translateX(-100%);transition:transform .22s ease;z-index:40;display:flex;flex-direction:column}
body.railopen #rail{transform:none}
#rail header{padding:18px 20px 10px;font-weight:700;font-size:15px}
#rail header small{display:block;color:var(--deck-mut);font-weight:500;margin-top:3px}
#rail .items{overflow:auto;padding:4px 12px 20px;flex:1}
#rail .vhead{margin:16px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--deck-accent)}
#rail .vhead small{display:block;color:var(--deck-mut);font-weight:500;text-transform:none;letter-spacing:0;margin-top:2px}
#rail button.item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--deck-ink);
  padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit}
#rail button.item:hover{background:rgba(255,255,255,.06)}
#rail button.item[aria-current="true"]{background:rgba(127,196,189,.16);color:#cfeeea}
#rail button.item em{display:block;font-style:normal;color:var(--deck-mut);font-size:12px;margin-top:1px}
/* dock */
#dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--deck-panel);
  border:1px solid var(--deck-edge);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45);
  display:flex;align-items:center;gap:10px;padding:8px 12px;white-space:nowrap}
#dock .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--deck-mut)}
#dock .pills{display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:9px;padding:3px}
#dock .pills button{border:0;background:none;color:var(--deck-mut);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:7px;cursor:pointer}
#dock .pills button[aria-pressed="true"]{background:rgba(127,196,189,.2);color:#d9f3ef}
#dock .step{display:flex;align-items:center;gap:8px}
#dock .step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--deck-edge);background:none;color:var(--deck-ink);cursor:pointer;font-size:14px}
#dock .step button:disabled{opacity:.35;cursor:default}
#dock #pos{font-size:12.5px;color:var(--deck-mut);min-width:52px;text-align:center}
#dock select{background:rgba(255,255,255,.06);color:var(--deck-ink);border:1px solid var(--deck-edge);border-radius:8px;
  height:30px;padding:0 8px;font:inherit;font-size:13px;max-width:250px}
#dock a.deck,#dock button.tools{border:1px solid var(--deck-edge);background:none;color:var(--deck-ink);border-radius:8px;
  height:30px;display:inline-flex;align-items:center;padding:0 12px;font-size:13px;text-decoration:none;cursor:pointer}
#dock a.deck:hover,#dock button.tools:hover{background:rgba(255,255,255,.06)}
/* screen-level shared bits */
.sbody ::-webkit-scrollbar{display:none}
.caveat{font-family:Caveat,cursive}
.serif{font-family:"Cormorant Garamond",serif}
/* ============================== LUMINA =================================== */
.v-lumina{--ink:#0e1c33;--mut:#7d879b;--deep:#0b5355;--teal:#0b635c;--tint:#e4f3f3;--tint2:#ddf4f4;
  --edge:#e7eaee;--page:#fbfcfc;--mint:#dcf1eb;--mintink:#17715c;--upc:#eaf2fd;--upcink:#5474a8;
  --cream:#f9f3eb;--blush:#f8ebe7;
  display:grid;grid-template-columns:245px 1fr;font-family:Inter,sans-serif;color:var(--ink);background:var(--page)}
.lum-side{background:#fcfdfe;border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:30px 22px 24px}
.lum-logo{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;letter-spacing:.24em;margin-left:6px}
.lum-logo small{display:block;font-family:Inter;font-size:9.5px;letter-spacing:.34em;color:var(--mut);margin-top:2px}
.lum-nav{margin-top:36px;display:flex;flex-direction:column;gap:6px}
.lum-nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:11px;color:#43506a;
  font-size:15.5px;font-weight:500;text-decoration:none}
.lum-nav a svg{width:19px;height:19px;stroke:#8b96ab;flex:none}
.lum-nav a.on{background:var(--tint);color:var(--deep);font-weight:600}
.lum-nav a.on svg{stroke:var(--deep)}
.lum-nav .badge{margin-left:auto;background:#e35d6a;color:#fff;font-size:11px;font-weight:700;border-radius:50%;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.lum-art{margin-top:auto;border-radius:14px;overflow:hidden;position:relative;height:270px}
.lum-art img{width:100%;height:100%;object-fit:cover}
.lum-art .cap{position:absolute;inset:auto 0 0 0;padding:18px;font-size:15px}
.lum-art .cap b{display:block;font-size:17px;line-height:1.3;margin-bottom:26px;color:#3d3428}
.lum-art .cap span{color:#6c604e;font-size:13.5px;line-height:1.45}
.lum-main{display:flex;flex-direction:column;overflow:hidden}
.lum-top{display:flex;align-items:center;gap:20px;padding:16px 34px;border-bottom:1px solid var(--edge);background:#fcfdfe}
.lum-top h2{font-size:25px;font-weight:700}
.lum-top p{color:var(--mut);font-size:14.5px;margin-top:3px}
.lum-top .script{margin-left:auto;font-family:Caveat;font-size:24px;color:#a89d8c;transform:rotate(-4deg);line-height:1}
.lum-top .bell{position:relative;color:#5d6880;font-size:19px;margin:0 6px}
.lum-user{display:flex;align-items:center;gap:11px}
.lum-user img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.lum-user b{font-size:14.5px;display:block}
.lum-user small{color:var(--mut);font-size:12.5px}
.lum-band{display:flex;align-items:center;gap:34px;padding:18px 34px 14px;background:#fcfdfe}
.lum-band h1{font-size:37px;font-weight:800;letter-spacing:-.01em}
.lum-band .sub{color:#55617a;font-size:15.5px;margin-top:6px}
.lum-band .sub b{color:var(--ink)}
.lum-ring{display:flex;align-items:center;gap:16px;margin-left:auto}
.lum-ring .meta b{font-size:14.5px;display:block}
.lum-ring .meta span{color:var(--mut);font-size:13px}
.lum-ring .bar{width:170px;height:7px;background:#e8edf0;border-radius:4px;margin-top:8px;overflow:hidden}
.lum-ring .bar i{display:block;height:100%;width:43%;background:var(--teal);border-radius:4px}
.lum-quote{border-left:1px solid var(--edge);padding-left:26px;margin-left:6px;max-width:200px}
.lum-quote .q{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;color:#3c4a63}
.lum-quote .a{color:var(--mut);font-size:12.5px;margin-top:5px;text-align:right}
.lum-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;padding:2px 34px 16px;background:#fcfdfe;border-bottom:1px solid var(--edge)}
.lum-card{border:1px solid var(--edge);border-radius:13px;background:#fff;padding:13px 16px;display:flex;align-items:center;gap:14px}
.lum-card .tile{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.lum-card .tile svg{width:22px;height:22px}
.lum-card small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:3px}
.lum-card b{font-size:16px;display:block}
.lum-card em{font-style:normal;color:var(--mut);font-size:13px;display:block;margin-top:2px}
.lum-card .chev{margin-left:auto;color:#aab3c2;font-size:19px}
.lum-body{flex:1;display:grid;grid-template-columns:1fr 448px;gap:20px;padding:18px 34px 20px;overflow:hidden;background:var(--page)}
.lum-road{border:1px solid var(--edge);border-radius:15px;background:#fff;padding:18px 22px;overflow:hidden;display:flex;flex-direction:column}
.lum-road-head{display:flex;align-items:flex-start}
.lum-road-head h3{font-size:19.5px;font-weight:700}
.lum-road-head p{color:var(--mut);font-size:13.5px;margin-top:4px}
.lum-road-head .cal{margin-left:auto;border:1px solid var(--edge);border-radius:10px;height:38px;display:flex;align-items:center;
  gap:9px;padding:0 15px;font-size:13.5px;font-weight:600;color:#42506b}
.lum-road-grid{margin-top:12px;display:grid;grid-template-columns:158px minmax(0,1fr);column-gap:18px;row-gap:0;flex:1}
.lum-month{padding:14px 0 0}
.lum-month h4{font-size:15.5px;font-weight:700;line-height:1.3}
.lum-month h4 small{display:block;color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:3px}
.lum-month p{color:var(--mut);font-size:12.5px;line-height:1.45;margin-top:7px}
.lum-month .prog{margin-top:12px;font-size:12px;color:#55617a;font-weight:600}
.lum-month .bar{height:6px;background:#e8edf0;border-radius:4px;margin-top:6px;overflow:hidden;width:118px}
.lum-month .bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.lum-steps{position:relative;padding-left:32px;min-width:0}
.lum-steps::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:2px;background:#dfe8ea}
.lum-step{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 0;border-bottom:1px solid #f0f3f5;position:relative;font-size:13px;min-height:41px}
.lum-step:last-child{border-bottom:0}
.lum-step .dot{position:absolute;left:-30px;width:24px;height:24px;border-radius:50%;background:#fff;
  border:2px solid #cfdcdc;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#7f8ba0}
.lum-step.done .dot{background:var(--teal);border-color:var(--teal)}
.lum-step.done .dot svg{width:12px;height:12px;stroke:#fff}
.lum-step.cur{background:var(--mint);border-radius:10px;margin-left:-12px;padding-left:12px;border-bottom:0}
.lum-step.cur .dot{left:-18px;background:var(--teal);border-color:var(--teal)}
.lum-step.cur .dot svg{width:12px;height:12px;stroke:#fff}
.lum-step.cond .dot{border-style:dashed}
.lum-step b{font-weight:600;font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.lum-step .date{margin-left:auto;color:var(--mut);font-size:11.8px;flex:none}
.lum-chip{flex:none;font-size:11px;font-weight:600;border-radius:20px;padding:3.5px 10px;min-width:82px;text-align:center}
.lum-chip.done{background:var(--mint);color:var(--mintink)}
.lum-chip.cur{background:var(--teal);color:#fff}
.lum-chip.cond{background:#eef0f4;color:#66708a}
.lum-chip.upc{background:var(--upc);color:var(--upcink)}
.lum-drawer{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.lum-detail{border:1px solid var(--edge);border-radius:15px;background:#fff;padding:19px 22px;position:relative}
.lum-detail .x{position:absolute;right:18px;top:16px;color:#aab3c2;font-size:18px}
.lum-detail .tile{width:42px;height:42px;border-radius:11px;background:var(--blush);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.lum-detail .tile svg{width:22px;height:22px;stroke:#d0685f}
.lum-detail h3{font-size:21px;font-weight:800;display:inline}
.lum-detail .cchip{display:inline-block;vertical-align:3px;margin-left:9px;background:var(--mint);color:var(--mintink);
  font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px}
.lum-detail .cchip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mintink);margin-right:5px}
.lum-detail .desc{color:#55617a;font-size:13px;line-height:1.45;margin-top:6px}
.lum-mini{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.lum-mini div{background:#f6f8f9;border-radius:10px;padding:9px 12px;display:flex;gap:9px;align-items:center}
.lum-mini svg{width:17px;height:17px;stroke:#66708a;flex:none}
.lum-mini small{display:block;color:var(--mut);font-size:11.5px}
.lum-mini b{font-size:13.5px}
.lum-check h5{font-size:13.5px;font-weight:700;margin:13px 0 2px;display:flex}
.lum-check h5 span{margin-left:auto;color:var(--mut);font-weight:500;font-size:12px}
.lum-check label{display:flex;align-items:center;gap:10px;font-size:13px;color:#43506a;padding:5px 0}
.lum-check .box{width:17px;height:17px;border:1.5px solid #c3ccd8;border-radius:5px;flex:none}
.lum-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.lum-btn{height:39px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13.5px;font-weight:600;border:1px solid var(--edge);color:#2e3c56;background:#fff}
.lum-btn svg{width:16px;height:16px}
.lum-btn.deep{background:var(--deep);border-color:var(--deep);color:#fff}
.lum-btn.deep svg{stroke:#fff}
.lum-btn.wide{grid-column:1/-1;border-color:#cddbdb;color:var(--deep)}
.lum-note{margin-top:11px;background:var(--cream);border:1px solid #eee3cd;border-radius:10px;color:#7a6740;
  font-size:12.5px;line-height:1.5;padding:11px 13px;display:flex;gap:9px}
.lum-focus{border:1px solid var(--edge);border-radius:15px;background:#fff;padding:15px 22px}
.lum-focus h4{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.lum-focus h4 .sun{color:#e2a93b;font-size:17px}
.lum-focus h4 span{margin-left:auto;color:var(--mut);font-size:12px;font-weight:500}
.lum-focus label{display:flex;align-items:center;gap:11px;padding:5.5px 0;font-size:13.2px;color:#43506a}
.lum-focus .box{width:17px;height:17px;border:1.5px solid #c3ccd8;border-radius:5px;flex:none}
.lum-focus label.done{color:#9aa4b5;text-decoration:line-through}
.lum-focus label.done .box{background:var(--teal);border-color:var(--teal);position:relative}
.lum-focus label.done .box::after{content:"✓";color:#fff;font-size:11px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* ============================== VIVARA =================================== */
.v-vivara{--ink:#111a2b;--mut:#8b8f99;--deep:#18555c;--teal:#2f8f83;--paper:#faf9f6;--band:#fcfbfa;
  --card:#fdfdfd;--edge:#e8e3dc;--mint:#e2f1ec;
  font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
.viv-nav{height:58px;background:#fcfbf9;border-bottom:1px solid var(--edge);display:flex;align-items:center;padding:0 36px;gap:40px}
.viv-logo{display:flex;align-items:center;gap:11px}
.viv-logo .leaf{color:var(--deep);font-size:24px;transform:rotate(-14deg)}
.viv-logo b{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:700;letter-spacing:.14em}
.viv-logo small{display:block;font-size:8.5px;letter-spacing:.18em;color:var(--mut);font-weight:600}
.viv-links{display:flex;gap:34px;margin:0 auto;font-size:15px;color:#454e60;height:100%;align-items:center}
.viv-links span{display:flex;align-items:center;height:100%;position:relative}
.viv-links .on{font-weight:700;color:var(--ink)}
.viv-links .on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--deep)}
.viv-right{display:flex;align-items:center;gap:18px}
.viv-right .em{width:36px;height:36px;border-radius:50%;background:var(--deep);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.viv-band{background:var(--band);border-bottom:1px solid var(--edge);padding:15px 36px 0}
.viv-band-row{display:flex;align-items:center;gap:18px}
.viv-eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:#9b948a}
.viv-band h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;letter-spacing:-.005em;margin-top:2px;white-space:nowrap}
.viv-band .sub{color:#5d6577;font-size:14.5px;margin-top:4px}
.viv-meta{display:flex;align-items:center;gap:0;margin-left:auto;flex:none}
.viv-meta .cell{display:flex;align-items:center;gap:11px;padding:0 18px;border-left:1px solid var(--edge)}
.viv-meta .tile{width:44px;height:44px;border-radius:50%;background:#f6ece7;color:#c07b62;display:flex;align-items:center;justify-content:center}
.viv-meta .tile.sq{border-radius:11px;background:#eef4f3;color:var(--deep)}
.viv-meta small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap}
.viv-meta b{font-size:14px;white-space:nowrap}
.viv-meta em{font-style:normal;display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.viv-script{font-family:Caveat;font-size:26px;color:#b0a99d;transform:rotate(-8deg);line-height:1.05;padding:0 10px}
.viv-tabs{display:flex;gap:34px;margin-top:10px;font-size:14px;color:#6b7284}
.viv-tabs span{padding:10px 2px;position:relative}
.viv-tabs .on{font-weight:700;color:var(--ink)}
.viv-tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--deep)}
.viv-grid{flex:1;display:grid;grid-template-columns:1fr 368px 368px;grid-template-rows:minmax(0,1fr) auto;gap:14px;padding:14px 36px 16px;overflow:hidden}

<script>
/* ------------------------------ deck engine ------------------------------ */
const stage=document.getElementById("stage"), railItems=document.getElementById("railitems"),
      pills=document.getElementById("vpills"), jump=document.getElementById("jump"),
      posEl=document.getElementById("pos");
let current=null;

function frameSize(s){return s.frame==="16:9"?{w:1672,h:941}:{w:1448,h:1086};}

function browserChrome(s){
  if(s.chrome==="mac")return `<div class="bc-mac"><div class="lights"><i></i><i></i><i></i></div>
    <div class="navarr">&#8249;&nbsp;&nbsp;&#8250;</div>
    <div class="urlpill"><span class="lock">&#128274;</span>${s.url||""}</div>
    <div class="bicons">&#8679;&nbsp;&nbsp;+&nbsp;&nbsp;&#9881;&nbsp;&nbsp;&#10064;</div></div>`;
  if(s.chrome==="tab")return `<div class="bc-tab" style="--tab-fav:${s.fav||"#0b5355"}">
    <div class="tabrow"><div class="tab"><span class="fav"></span>${s.tabTitle||s.title}<span class="x">&times;</span></div>
    <span class="tabplus">+</span><div class="winbtns"><span>&#8211;</span><span>&#9633;</span><span>&times;</span></div></div>
    <div class="toolrow"><span class="arr">&larr;</span><span class="arr">&rarr;</span><span class="arr">&#8635;</span>
    <div class="url"><span class="lock">&#128274;</span>${s.url||""}</div>
    <div class="ticons"><span>&#9734;</span><span>&#8942;</span></div></div></div>`;
  return "";
}

function fit(){
  const f=stage.querySelector(".frame"); if(!f)return;
  const s=SCREENS[current], sz=frameSize(s);
  const availW=innerWidth-52, availH=innerHeight-92;
  const k=Math.min(availW/sz.w, availH/sz.h, 1);
  f.style.transform=`scale(${k})`;
  stage.style.width=(sz.w*k)+"px"; stage.style.height=(sz.h*k)+"px";
}

function render(id){
  if(!SCREENS[id])return;
  current=id;
  const s=SCREENS[id], sz=frameSize(s);
  const chromeH=s.chrome==="mac"?56:s.chrome==="tab"?84:0;
  stage.innerHTML=`<div class="frame" style="width:${sz.w}px;height:${sz.h}px">
    ${browserChrome(s)}
    <div class="sbody v-${s.version}" style="height:${sz.h-chromeH}px">${s.html}</div></div>`;
  fit();
  const i=ORDER.indexOf(id);
  posEl.textContent=`${i+1} / ${ORDER.length}`;
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===ORDER.length-1;
  jump.value=id;
  document.querySelectorAll("#railitems .item").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  document.querySelectorAll("#vpills button").forEach(b=>b.setAttribute("aria-pressed",String(SCREENS[id].version===b.dataset.v)));
  history.replaceState(null,"","#"+id);
  document.title=`${VERSIONS[s.version].label} — ${s.title} · V2 Patient Portal`;
}

function buildNav(){
  const byV={};
  ORDER.forEach(id=>{(byV[SCREENS[id].version]=byV[SCREENS[id].version]||[]).push(id);});
  railItems.innerHTML=Object.entries(byV).map(([v,ids])=>`
    <div class="vhead">${VERSIONS[v].label}<small>${VERSIONS[v].sub}</small></div>`+
    ids.map(id=>`<button class="item" data-go="${id}">${SCREENS[id].title}<em>${SCREENS[id].route}</em></button>`).join("")
  ).join("");
  railItems.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)render(b.dataset.go);});
  pills.innerHTML=Object.entries(byV).map(([v])=>`<button data-v="${v}">${VERSIONS[v].label}</button>`).join("");
  pills.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)render(byV[b.dataset.v][0]);});
  jump.innerHTML=ORDER.map(id=>`<option value="${id}">${VERSIONS[SCREENS[id].version].label} — ${SCREENS[id].title}</option>`).join("");
  jump.addEventListener("change",()=>render(jump.value));
}

document.getElementById("prev").onclick=()=>{const i=ORDER.indexOf(current);if(i>0)render(ORDER[i-1]);};
document.getElementById("next").onclick=()=>{const i=ORDER.indexOf(current);if(i<ORDER.length-1)render(ORDER[i+1]);};
document.getElementById("railbtn").onclick=()=>document.body.classList.toggle("railopen");
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")document.getElementById("prev").click();
  if(e.key==="ArrowRight")document.getElementById("next").click();
  if(e.key==="Escape")document.body.classList.remove("railopen");
});
addEventListener("resize",fit);
buildNav();
render(location.hash&&SCREENS[location.hash.slice(1)]?location.hash.slice(1):ORDER[0]);
</script>
</body>
</html>
